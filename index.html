    ${group('Cancelled', all.filter(r => r.status === 'Cancelled'))}
    ${all.length ? '' : '<p class="muted">No routes for this day yet. Upload an OpenFleet file to add them.</p>'}`;
}

function vRoute() {
  const r = route(S.params.id); if (!r) return '<p>Route not found.</p>';
  const a = area(r.area), d = driver(r.driverId), o = r.offerId && offer(r.offerId);
  const hist = S.offers.filter(x => x.routeId === r.id).sort((x, y) => (y.sentAt || 0) - (x.sentAt || 0));
  const msgs = S.messages.filter(m => m.routeId === r.id).sort((x, y) => x.time - y.time);
  const hb = hoursToStart(r);
  const actions = [];
  if (r.status === 'Unassigned') { actions.push(`<button class="btn primary" onclick="openPicker('${r.id}','sms')">Offer</button>`, `<button class="btn" onclick="openPicker('${r.id}','phone')">Assign by phone</button>`, `<button class="btn ghost" onclick="route('${r.id}').status='Cancelled';render()">Client cancelled</button>`); }
  if (r.status === 'Offered') actions.push(`<button class="btn" onclick="withdraw(route('${r.id}'))">Withdraw offer</button>`);
  if (['Accepted', 'Needs attention'].includes(r.status)) actions.push(`<button class="btn danger" onclick="openRelease('${r.id}')">Release driver</button>`);
  if (r.status === 'Needs attention' && o && o.pending) actions.push(`<button class="btn primary" onclick="confirmedByPhone(route('${r.id}'))">Confirmed by phone</button>`);
  if (r.status === 'Needs attention' && r.attention === 'Order changed after acceptance') actions.push(`<button class="btn primary" onclick="retext(route('${r.id}'))">Re-text driver</button>`, `<button class="btn" onclick="clearAttention(route('${r.id}'))">Keep as is</button>`);
  if (r.status === 'Needs attention' && ['Driver deactivated in Airtable', 'Driver on hold'].includes(r.attention)) actions.push(`<button class="btn" onclick="openRelease('${r.id}','Dispatcher')">Reassign</button>`);
  if (r.attention === 'Order not in latest file' && r.status !== 'Needs attention') actions.push(`<button class="btn" onclick="route('${r.id}').attention=null;render()">Keep order</button>`);
  const sim = ['Accepted'].includes(r.status) && o && !o.pending ? `<div class="panel"><h3>Confirmation checks</h3><p class="small muted" style="margin:0 0 8px">Scheduled by the job runner in the hub's time zone: heads-up ${48}h before, reconfirm ${S.settings.reconfirmHours}h before, final ${S.settings.finalHours}h before. Fire one now for the demo.</p><div class="row">
    <button class="btn sm" onclick="sendHeadsUp(route('${r.id}'))">Send heads-up</button><button class="btn sm" onclick="sendCheck(route('${r.id}'),'reconfirm')">Send reconfirm</button><button class="btn sm" onclick="sendCheck(route('${r.id}'),'final')">Send final confirm</button></div></div>` : '';
  const pendingBox = o && o.pending && r.status !== 'Needs attention' ? `<div class="notice info"><div>Waiting on ${d.name}'s ${o.pending === 'reconfirm' ? 'reconfirm' : o.pending === 'final' ? 'final confirm' : 'reply to the change'}. <button class="btn sm" style="margin-left:8px" onclick="silentOnCheck(route('${r.id}'))">Simulate ${o.pending === 'reconfirm' ? S.settings.reconfirmWindow : S.settings.finalWindow} min of silence</button></div></div>` : '';
  const ciPanel = dayOffset(r) === 0 && (d || r.noShow) ? `<div class="panel"><h3>Site check-in</h3>${r.noShow ? `<p class="small" style="margin:0 0 8px;color:var(--crit)">${driver(r.noShow.driverId).name} marked no-show at ${fmtTime(r.noShow.at)} by ${r.noShow.by}.</p>` : ''}${d ? `<div class="row">${ciTag(r)}${(!r.checkin || r.checkin.status === 'Late') ? `<button class="btn sm" onclick="checkIn('${r.id}','Arrived')">Arrived</button>${r.checkin ? '' : `<button class="btn sm" onclick="checkIn('${r.id}','Late')">Late</button>`}<button class="btn sm danger" onclick="checkIn('${r.id}','No-show')">No-show</button>` : ''}</div>` : '<p class="small muted" style="margin:0">Rescue open. No driver yet.</p>'}</div>` : '';
  return `<button class="btn ghost sm" onclick="go('board')">← Board</button>
  <div class="page-head" style="margin-top:8px"><div><h1>${r.name} ${statusPill(r)}</h1><p>${fmtDate(routeDate(r))} · ${hhmm(r.start)} · ${a.name} / ${a.hub} · ${r.vehicle}${hb > 0 && hb < 48 ? ` · starts in ${dur(routeStart(r) - now.getTime())}` : ''}${r.laneId ? ` · <a style="cursor:pointer" onclick="go('lane',{id:'${r.laneId}'})">↻ ${esc(lane(r.laneId).name)}</a>` : ''}</p></div><div class="row">${actions.join('')}</div></div>
  ${r.attention ? `<div class="notice warn" style="margin-bottom:12px"><div><b>Needs a decision:</b> ${r.attention}.${r.attention === 'Driver deactivated in Airtable' ? ' Driver stays attached until you act; the picker will not offer them new work.' : ''}</div></div>` : ''}
  ${pendingBox}
  <div class="two" style="margin-top:12px">
    <div class="stack">
      <div class="panel"><h3>Driver</h3>${d ? `<div class="row" style="margin-bottom:8px">${driverLine(r)}<span class="mono small muted">${phoneFmt(d.phone)}</span></div>
        <label class="small"><input type="checkbox" id="onf" ${r.onfleet ? 'checked' : ''} ${['Accepted', 'Needs attention'].includes(r.status) ? '' : 'disabled'} onchange="route('${r.id}').onfleet=this.checked;render()"> Assigned in Onfleet (manual step in v1)</label>` : `<p class="muted small" style="margin:0">No driver. ${r.status === 'Unassigned' ? 'Offer the route or assign by phone.' : ''}</p>`}
        ${r.status === 'Offered' && o ? `<p class="small" style="margin:8px 0 0">Open offer, <span class="countdown" data-countdown="${o.id}">${Math.ceil((o.expiresAt - now.getTime()) / 60000)} min left</span>. The driver replies on the phone panel.</p>` : ''}</div>
      ${ciPanel}
      ${sim}
      <div class="panel"><h3>Orders <span class="muted small">${activeStops(r)} active</span></h3><div class="tbl"><table><thead><tr><th>Order</th><th>Address</th><th>Customer</th><th class="r">Pkgs</th><th></th></tr></thead><tbody>
        ${r.orders.map(x => `<tr${x.status === 'cancelled' ? ' style="opacity:.5"' : ''}><td class="mono">${x.id}</td><td>${esc(x.addr)}</td><td>${x.name}</td><td class="r num">${x.pkgs}</td><td class="small">${x.status === 'cancelled' ? '<span class="pill cancelled">Cancelled</span>' : ''}${!x.inLatest && x.status === 'active' ? '<span class="pill attention">Not in latest file</span>' : ''}${x.history.length ? `<span class="muted" title="${esc(x.history.map(h => `${h.field}: ${h.old} → ${h.new} (${h.batch})`).join('\n'))}">changed ×${x.history.length}</span>` : ''}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel"><h3>Message thread</h3>${msgs.length ? `<div class="thread">${msgs.map(m => `<div class="msg ${m.dir} ${m.status === 'failed' ? 'failed' : ''}">${esc(m.body)}<span class="mt">${fmtDT(m.time)} · ${m.dir === 'out' ? (m.status === 'failed' ? 'Failed: ' + m.error : 'Delivered') : 'From ' + (driver(m.driverId)?.name || m.phone)} · ${m.sid}</span></div>`).join('')}</div>` : '<p class="muted small" style="margin:0">No texts yet on this route.</p>'}</div>
    </div>
    <div class="stack">
      ${lanePanel(r)}
      <div class="panel"><h3>Pay</h3><div class="pay"><span>${activeStops(r)} stops × ${money(a.ppd)} per drop</span><span class="num">${money(payout(r))}</span><span>Route fee (greater of ${money(S.settings.feeMin)} or ${S.settings.feePct}%)</span><span class="num">−${money(fee(r))}</span><span>Adjustments</span><span class="num">${money(adjTotal(r))}</span><span class="tot">Net payout</span><span class="tot num">${money(net(r))}</span></div>
        ${r.approved ? `<p class="small muted" style="margin:8px 0 0">Locked. Approved by ${r.approved.by}, ${fmtDT(r.approved.at)}.</p>` : `<p class="small muted" style="margin:8px 0 0">Recalculates when stops change until approved for pay.</p>`}</div>
      <div class="panel"><h3>Pickup</h3><dl class="kv"><dt>Hub</dt><dd>${a.hub}</dd><dt>Address</dt><dd>${a.address}</dd><dt>Time</dt><dd class="mono">${hhmm(r.start)}</dd><dt>Instructions</dt><dd>${a.instr}</dd></dl></div>
      <div class="panel"><h3>Offer history <span class="muted small">ledger</span></h3>${hist.length ? hist.map(x => { const dd = driver(x.driverId); const evs = S.events.filter(e => e.offerId === x.id).sort((p, q) => p.time - q.time); return `<div style="margin-bottom:12px"><div class="row" style="margin-bottom:4px"><span class="avatar">${initials(dd.name)}</span><b>${dd.name}</b><span class="mono small muted">${x.id} · ${x.channel}</span>${x.outcome ? `<span class="pill ${x.outcome === 'Completed' ? 'accepted' : ['Late bail', 'No-show'].includes(x.outcome) ? 'rescue' : 'unassigned'}">${x.outcome}</span>` : x.open ? '<span class="pill offered">Open</span>' : '<span class="pill accepted">Active</span>'}${x.rescueCover ? '<span class="pill completed">Rescue cover</span>' : ''}</div><ul class="timeline">${evs.map(e => `<li><span class="t">${fmtTime(e.time)}</span><span><b>${e.type}</b> <span class="muted">${e.actor}${e.details ? ' · ' + e.details : ''}</span></span></li>`).join('')}</ul></div>`; }).join('') : '<p class="muted small" style="margin:0">No offers yet.</p>'}</div>
    </div></div>`;
}

function lanePanel(r) {
  const l = lane(r.laneId), m = r.laneMatch;
  if (!l) return `<div class="panel"><h3>Route history</h3><p class="small muted" style="margin:0 0 8px">No lane matched. ${m && m.pct > 0 ? `Closest is ${esc(lane(m.laneId).name)} at ${Math.round(m.pct * 100)}% (${m.seen} of ${m.total} stops), under the ${S.settings.laneThreshold}% threshold.` : 'None of these stops appear on a known lane.'} It starts a lane of its own once it completes.</p>
    <div class="row"><select id="linkLane">${S.lanes.filter(x => x.area === r.area).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn sm" onclick="route('${r.id}').laneId=document.getElementById('linkLane').value;route('${r.id}').laneManual=true;render();toast('Linked. Future matches will learn from this run.')">Link to a lane anyway</button></div></div>`;
  const s = laneSuggestion(r), pct = laneMatchPct(r);
  const skipped = s.cands.filter(c => c !== s.pick && c.blocked.length);
  const off = S.settings.laneAuto === 'off';
  return `<div class="panel lane-panel"><h3><span class="lane"><span class="ico">↻</span></span> ${esc(l.name)}</h3>
  <p class="small muted" style="margin:0 0 8px">${r.history ? 'A past run on this lane.' : pct !== null ? `${pct}% match: ${m.seen} of ${m.total} stops were on this lane's last ${Math.min(S.settings.laneWindow, s.runs.length)} runs.` : 'Linked by a dispatcher.'} ${s.regular ? `Regular driver ${s.regular.d.name}, ${s.regular.n} of the last ${s.regular.of}.` : ''} <a style="cursor:pointer" onclick="go('lane',{id:'${l.id}'})">Full history</a></p>
  ${off ? '<p class="small muted" style="margin:0">Driver suggestions are off (Settings › Lanes).</p>' : s.pick ? `<div class="notice ok"><div><b>${s.pick.d.name}</b> ${s.pick.why}, ${s.pick.n} of the last ${s.runs.length} runs. ${lblHtml(s.pick.d)}
      ${r.status === 'Unassigned' ? `<div class="row" style="margin-top:8px"><button class="btn sm primary" onclick="offerRoute(route('${r.id}'),driver('${s.pick.d.id}'),'sms')">Offer to ${shortName(s.pick.d)}</button><button class="btn sm" onclick="offerRoute(route('${r.id}'),driver('${s.pick.d.id}'),'phone')">Assign by phone</button><button class="btn sm ghost" onclick="openPicker('${r.id}','sms')">Someone else</button></div>` : r.driverId === s.pick.d.id ? '<div class="small" style="margin-top:4px">Already on this route.</div>' : r.status === 'Needs attention' ? '<div class="small" style="margin-top:4px">Suggested if you release the current driver.</div>' : ''}</div></div>` : `<div class="notice warn"><div>No past driver is available for this one${s.cands.length ? '' : ': no completed runs with a driver yet'}. Use Offer to pick from the full list.</div></div>`}
  ${skipped.length && !off ? `<p class="small muted" style="margin:8px 0 0">Skipped: ${skipped.map(c => `${c.d.name} (${c.blocked.join(', ').toLowerCase()})`).join('; ')}.</p>` : ''}
  <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Last runs</th><th>Driver</th><th class="r">Stops</th><th>Outcome</th></tr></thead><tbody>${s.runs.slice(0, 5).map(x => `<tr class="clickable" onclick="go('route',{id:'${x.id}'})"><td class="small">${fmtDate(routeDate(x))} <span class="mono muted">${x.name}</span></td><td>${driver(x.driverId).name}</td><td class="r num">${activeStops(x)}</td><td>${x.outcome ? `<span class="pill ${x.outcome === 'Completed' ? 'accepted' : 'rescue'}">${x.outcome}</span>` : '<span class="pill unassigned">Awaiting closeout</span>'}</td></tr>`).join('') || '<tr><td colspan="4" class="muted small">No runs yet.</td></tr>'}</tbody></table></div>
  ${r.history ? '' : `<div style="margin-top:8px"><button class="btn sm ghost" onclick="route('${r.id}').laneId=null;route('${r.id}').laneManual=true;render()">Not this lane</button></div>`}</div>`;
}
function openPicker(rid, mode) {
  const r = route(rid);
  const l = lane(r.laneId), counts = l ? laneDriverCounts(l, r.id) : {};
  const rows = S.drivers.map(d => ({ d, s: stats(d), why: eligibility(d, r), ln: counts[d.id] || 0 })).sort((x, y) => (x.why.length - y.why.length) || (y.ln - x.ln) || (y.s.score - x.s.score));
  modal(`<div class="mh"><div><h2>${mode === 'phone' ? 'Assign by phone' : 'Offer'} ${r.name}</h2><p class="muted small" style="margin:2px 0 0">${fmtDate(routeDate(r))} · ${hhmm(r.start)} · ${activeStops(r)} stops · ${money(payout(r))}. ${mode === 'phone' ? 'Records an accepted offer with channel Phone and sends the confirmation text only.' : 'One driver at a time. The route locks on YES.'}</p></div><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
  <div class="notice info small"><div>Eligible means: active in Airtable for Logiscal, in ${area(r.area).name}, not booked ${fmtDate(routeDate(r))}, no open offer, not opted out. Synced ${$('#synced').textContent}. <button class="btn sm ghost" onclick="toast('Airtable sync requested. Up to date.')">Sync now</button></div></div>
  <div class="tbl picker"><table><thead><tr><th>Driver</th><th>Status</th><th class="r">Score</th><th>Completion</th><th class="r">Days since route</th><th>Phone</th><th></th></tr></thead><tbody>
  ${rows.map(({ d, s, why, ln }) => `<tr class="${why.length ? 'ineligible' : 'clickable'}" ${why.length ? '' : `onclick="offerRoute(route('${rid}'),driver('${d.id}'),'${mode}')"`}><td><div class="row"><span class="avatar">${initials(d.name)}</span><div><div>${d.name}${ln ? ` <span class="pill completed" title="Completed runs on ${esc(l.name)} in the last ${S.settings.laneWindow}">↻ ran it ${ln}×</span>` : ''}</div><div class="mono small muted">${d.gid}${d.tier ? ' · Tier ' + d.tier : ''}</div></div></div></td><td>${lblHtml(d)}</td><td class="r score">${s.label === 'New' ? '—' : s.score}</td><td><span class="bar"><i style="width:${Math.round(s.comp * 100)}%"></i></span> <span class="num small">${s.committed ? Math.round(s.comp * 100) + '%' : '—'}</span></td><td class="r num">${s.days ?? '—'}</td><td class="mono small">${phoneFmt(d.phone)}</td><td class="small">${why.length ? `<span class="muted">${why.join(', ')}</span>` : `<button class="btn sm primary">${mode === 'phone' ? 'Assign' : 'Send offer'}</button>`}</td></tr>`).join('')}
  </tbody></table></div>
  ${mode === 'sms' ? `<div class="small muted">Text that will send: <span class="mono">${esc(fill(S.settings.templates.offer, r))}</span></div>` : ''}`);
}
function openRelease(rid, preset) {
  const r = route(rid), hb = hoursToStart(r);
  modal(`<div class="mh"><h2>Release driver from ${r.name}</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
  <p class="small muted" style="margin:0">Route starts in ${dur(routeStart(r) - now.getTime())} (${Math.round(hb * 10) / 10} h). Who initiated the release decides the outcome recorded on the offer ledger.</p>
  <div class="radio">
    <label><input type="radio" name="rel" value="Driver" ${!preset ? 'checked' : ''}><span><b>Driver</b> asked out<br><span class="small muted">${hb < 24 ? 'Under 24 h before start, so this records a Late bail and flags the route Rescue.' : '24 h or more before start, so this records an Early release.'}</span></span></label>
    <label><input type="radio" name="rel" value="Dispatcher" ${preset === 'Dispatcher' ? 'checked' : ''}><span><b>Dispatcher</b> reassigning for ops reasons<br><span class="small muted">Neutral outcome. Counts as sent and accepted, not against completion.</span></span></label>
    <label><input type="radio" name="rel" value="Client cancel"><span><b>Client</b> cancelled the route<br><span class="small muted">Excluded from stats. Route goes to Cancelled.</span></span></label>
  </div>
  <div class="mf"><button class="btn" onclick="closeModal()">Keep driver</button><button class="btn danger" onclick="release(route('${rid}'),document.querySelector('input[name=rel]:checked').value)">Release</button></div>`);
}
function modal(html) { $('#modalRoot').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">${html}</div></div>`; }
function closeModal() { $('#modalRoot').innerHTML = ''; }

function vUpload() {
  const p = S.importPreview;
  const head = `<div class="page-head"><div><h1>Upload and review</h1><p>Drop the OpenFleet export. Merge key is the order ID; an upload never deletes an order or undoes work on a route.</p></div></div>`;
  if (!p) return head + `<div class="drop"><div>Drag an OpenFleet CSV here, or pick a sample for the demo</div><div class="files"><button class="btn primary" onclick="S.importPreview=buildPreview('weekend');render()">openfleet_export_2026-10-17_18.csv${S.uploadsDone.weekend ? ' (again)' : ''}</button></div><div class="small muted" style="margin-top:10px">Column mapping saved for Logiscal on Oct 6. You will only map again if the columns change.</div></div>
    <div class="group-title"><h3>Import history</h3></div><div class="panel"><div class="tbl"><table><thead><tr><th>Batch</th><th>File</th><th>By</th><th>When</th><th class="r">New</th><th class="r">Changed</th><th class="r">Unchanged</th><th class="r">Missing</th><th class="r">Rejected</th></tr></thead><tbody>${S.imports.map(b => `<tr><td class="mono">${b.id}</td><td class="mono small">${b.file}</td><td>${b.by}</td><td class="small">${fmtDT(b.time)}</td><td class="r num">${b.counts.new}</td><td class="r num">${b.counts.changed}</td><td class="r num">${b.counts.unchanged}</td><td class="r num">${b.counts.missing}</td><td class="r num">${b.counts.rejected}</td></tr>`).join('')}</tbody></table></div></div>`;
  const flag = st => ['Offered', 'Accepted', 'Needs attention'].includes(st) ? '<span class="pill attention">Will flag Needs attention</span>' : '<span class="muted small">Route recalculates</span>';
  return head + `<div class="panel" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><div><b class="mono">${p.file}</b> <span class="muted small">· ${p.rows} rows · parsed with the saved Logiscal mapping</span></div><div class="row"><button class="btn" onclick="S.importPreview=null;render()">Discard</button><button class="btn primary" onclick="applyImport(S.importPreview);S.importPreview=null;go('board')">Confirm import</button></div></div></div>
  ${p.repeat ? `<div class="notice ok"><div>This file matches the last import exactly. Confirming saves a batch with 0 changes and nothing else happens.</div></div>` : ''}
  <div class="counts"><div class="cnt new"><div class="v">${p.new.length}</div><div class="k">New</div></div><div class="cnt changed"><div class="v">${p.changed.length}</div><div class="k">Changed</div></div><div class="cnt"><div class="v">${p.unchanged}</div><div class="k">Unchanged</div></div><div class="cnt missing"><div class="v">${p.missing.length}</div><div class="k">Missing</div></div><div class="cnt rejected"><div class="v">${p.rejected.length}</div><div class="k">Rejected</div></div></div>
  ${(p.routes || []).length ? (() => { const rows = p.routes.map(x => { const tmp = Object.assign({ id: x.name, status: 'Unassigned', laneId: null, laneMatch: null, laneManual: false, history: false, driverId: null, offerId: null, start: area(x.area).pickup }, x); relink(tmp); return { x, tmp, s: laneSuggestion(tmp) }; }); return `<div class="group-title"><h3>New routes in this file</h3><span class="n">matched against lane history</span></div><div class="panel"><div class="tbl"><table><thead><tr><th>Route</th><th class="r">Stops</th><th>Lane</th><th>Suggested driver</th><th>On import</th></tr></thead><tbody>${rows.map(({ x, tmp, s }) => `<tr><td class="mono">${x.name}</td><td class="r num">${x.orders.length}</td><td>${tmp.laneId ? `<span class="lane"><span class="ico">↻</span>${esc(lane(tmp.laneId).name)} <span class="muted">${Math.round(tmp.laneMatch.pct * 100)}%, ${tmp.laneMatch.seen} of ${tmp.laneMatch.total} stops</span></span>` : '<span class="muted">No match</span>'}</td><td>${s && s.pick ? `${s.pick.d.name} <span class="muted small">${s.pick.why}</span>` : s ? '<span class="muted">none available</span>' : '<span class="muted">—</span>'}</td><td>${S.settings.laneAuto === 'auto' && s && s.pick ? '<span class="pill offered">Offer text goes out</span>' : s && s.pick && S.settings.laneAuto !== 'off' ? '<span class="pill accepted">One-click offer ready</span>' : '<span class="pill unassigned">Unassigned</span>'}</td></tr>`).join('')}</tbody></table></div></div>`; })() : ''}
  ${p.new.length ? `<div class="group-title"><h3>New orders</h3><span class="n">${p.new.length}, forming route RR-0420 (Austin North, Sat Oct 17)</span></div><div class="panel"><div class="tbl"><table><thead><tr><th>Order</th><th>Route</th><th>Address</th><th>Customer</th></tr></thead><tbody>${p.new.slice(0, 5).map(x => `<tr><td class="mono">${x.order.id}</td><td class="mono">${x.routeName}</td><td>${esc(x.order.addr)}</td><td>${x.order.name}</td></tr>`).join('')}${p.new.length > 5 ? `<tr><td colspan="4" class="muted small">and ${p.new.length - 5} more</td></tr>` : ''}</tbody></table></div></div>` : ''}
  ${p.changed.length ? `<div class="group-title"><h3>Changed orders</h3></div><div class="panel"><div class="tbl"><table><thead><tr><th>Order</th><th>Route</th><th>Field</th><th>Old → new</th><th>Effect</th></tr></thead><tbody>${p.changed.map(c => `<tr><td class="mono">${c.order ? c.order.id : c.added.map(o => o.id).join(', ')}</td><td class="mono">${c.routeName} <span class="pill ${c.routeStatus === 'Unassigned' ? 'unassigned' : 'accepted'}">${c.routeStatus}</span></td><td>${c.field}</td><td class="diff"><span class="old">${esc(c.old)}</span><br><span class="new">${esc(c.new)}</span></td><td>${flag(c.routeStatus)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  ${p.missing.length ? `<div class="group-title"><h3>In the system but missing from this file</h3></div><div class="panel"><div class="tbl"><table><thead><tr><th>Order</th><th>Route</th><th>Address</th><th>Decision</th></tr></thead><tbody>${p.missing.map((m, i) => `<tr><td class="mono">${m.order.id}</td><td class="mono">${m.routeName} <span class="pill unassigned">${m.routeStatus}</span></td><td>${esc(m.order.addr)}</td><td><select onchange="S.importPreview.missing[${i}].decision=this.value"><option value="keep" ${m.decision === 'keep' ? 'selected' : ''}>Keep, mark "Not in latest file"</option><option value="cancel">Cancel the order</option></select></td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Never auto-deleted. Kept orders show a flag on the route until you decide.</p></div>` : ''}
  ${p.rejected.length ? `<div class="group-title"><h3>Rejected rows</h3><span class="n">the rest of the file still imports</span></div><div class="panel"><div class="tbl"><table><thead><tr><th>Row</th><th>Order ID</th><th>Reason</th></tr></thead><tbody>${p.rejected.map(x => `<tr><td class="num">${x.row}</td><td class="mono">${x.id}</td><td style="color:var(--crit)">${x.reason}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
}

function vCheckin() {
  const rs = checkinRoutes();
  const n = k => rs.filter(r => r.checkin && r.checkin.status === k).length;
  const due = rs.filter(r => r.driverId && r.status !== 'Offered'), waiting = due.filter(r => !r.checkin).length, noshows = rs.filter(r => r.noShow).length;
  const m = (k, v, c) => `<div class="cnt ${c || ''}"><div class="v num">${v}</div><div class="k">${k}</div></div>`;
  const row = r => { const d = driver(r.driverId), c = r.checkin;
    return `<div class="checkin-row"><div><div class="row"><b class="mono" style="cursor:pointer" onclick="go('route',{id:'${r.id}'})">${r.name}</b><span class="mono small">${hhmm(r.start)}</span>${d ? `<span>${d.name}</span>` : '<span class="muted">No driver yet</span>'}${ciTag(r)}${r.rescue && !['Accepted', 'Completed'].includes(r.status) ? ' <span class="pill rescue">Rescue</span>' : ''}${r.status === 'Offered' ? ' <span class="pill offered">Rescue offer out</span>' : ''}</div>
      ${r.noShow ? `<div class="small" style="color:var(--crit);margin-top:2px">${driver(r.noShow.driverId).name} no-show at ${fmtTime(r.noShow.at)}${r.status === 'Accepted' ? `, covered by ${d.name}` : ''}</div>` : ''}${c ? `<div class="small muted">Marked by ${c.by}</div>` : ''}</div>
      <div class="checkin-btns">${d && r.status === 'Accepted' && (!c || c.status === 'Late') ? `<button class="btn ${c ? '' : 'primary'}" onclick="checkIn('${r.id}','Arrived')">Arrived</button>${c ? '' : `<button class="btn" onclick="checkIn('${r.id}','Late')">Late</button>`}<button class="btn danger" onclick="checkIn('${r.id}','No-show')">No-show</button>` : ''}</div></div>`; };
  return `<div class="page-head"><div><h1>Site check-in</h1><p>${fmtDate(now)}. Hub staff or the dispatcher mark each driver at pickup. It shows on the board right away, and a no-show starts a same-day rescue${S.settings.noShowRescue === 'auto' ? ' and texts the next best driver' : ''}.</p></div></div>
  <div class="counts" style="margin-bottom:14px">${m('Expected', due.length)}${m('Arrived', n('Arrived'), 'new')}${m('Late', n('Late'), 'missing')}${m('Waiting', waiting, 'changed')}${m('No-shows', noshows, 'rejected')}</div>
  ${S.areas.map(a => { const ar = rs.filter(r => r.area === a.id); return ar.length ? `<div class="panel" style="margin-bottom:12px"><h3>${a.hub} <span class="muted small">${a.address}</span></h3>${ar.map(row).join('')}</div>` : ''; }).join('') || '<p class="muted">No routes with drivers today.</p>'}`;
}
function vAttention() {
  const rs = S.routes.filter(r => (r.status === 'Needs attention' || r.attention) && r.status !== 'Cancelled').sort((a, b) => routeStart(a) - routeStart(b));
  return `<div class="page-head"><div><h1>Needs attention</h1><p>Every route waiting on a dispatcher decision, and why. The driver stays attached until you act.</p></div></div>
  ${holdSuggestionsHtml()}
  ${rs.length ? `<div class="panel"><div class="tbl"><table><thead><tr><th>Route</th><th>Starts</th><th>Driver</th><th>Why</th><th>Status</th><th></th></tr></thead><tbody>${rs.map(r => `<tr class="clickable" onclick="go('route',{id:'${r.id}'})"><td><b class="mono">${r.name}</b><div class="small muted">${area(r.area).hub}</div></td><td class="small">${fmtDate(routeDate(r))} ${hhmm(r.start)}<div class="muted">in ${dur(routeStart(r) - now.getTime())}</div></td><td><div class="row">${driverLine(r)}</div></td><td style="color:var(--warn)">${r.attention}</td><td>${statusPill(r)}</td><td><button class="btn sm primary" onclick="event.stopPropagation();go('route',{id:'${r.id}'})">Decide</button></td></tr>`).join('')}</tbody></table></div></div>` : S.holdSuggestions.length ? '' : '<div class="notice ok"><div>Nothing waiting on you.</div></div>'}`;
}

function vInbox() {
  const ms = S.messages.filter(m => (m.dir === 'in' && (!m.driverId || m.kind)) || m.status === 'failed').sort((a, b) => b.time - a.time);
  const kindLabel = m => m.status === 'failed' ? '<span class="pill rescue">Failed send</span>' : !m.driverId ? '<span class="pill attention">Unmatched number</span>' : m.kind === 'optout' ? '<span class="pill attention">STOP</span>' : m.kind === 'optin' ? '<span class="pill accepted">START</span>' : m.kind === 'late' ? '<span class="pill unassigned">Reply with no open offer</span>' : '<span class="pill unassigned">No matching action</span>';
  return `<div class="page-head"><div><h1>Messages inbox</h1><p>Inbound texts that did not match an action, texts from unknown numbers, and failed sends. Everything else lives on its route.</p></div></div>
  <div class="panel"><div class="tbl"><table><thead><tr><th>When</th><th>From / to</th><th>Message</th><th>Type</th><th></th></tr></thead><tbody>${ms.map(m => { const d = driver(m.driverId); return `<tr><td class="small mono">${fmtDT(m.time)}</td><td>${d ? `<div>${d.name}</div><div class="mono small muted">${phoneFmt(d.phone)}</div>` : `<div class="mono">${phoneFmt(m.phone)}</div><div class="small muted">no driver on file</div>`}</td><td>${esc(m.body)}${m.error ? `<div class="small" style="color:var(--crit)">${m.error}</div>` : ''}</td><td>${kindLabel(m)}</td><td>${m.status === 'failed' ? `<button class="btn sm" onclick="this.closest('tr').remove();toast('Resent. Delivered.')">Retry</button>` : m.routeId ? `<button class="btn sm" onclick="go('route',{id:'${m.routeId}'})">Route</button>` : d ? `<button class="btn sm" onclick="S.phoneDriver='${d.id}';go('driver',{id:'${d.id}'})">Driver</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>`;
}

function vCloseout() {
  const rs = closeoutRoutes().sort((a, b) => routeStart(a) - routeStart(b));
  const canApprove = S.role !== 'dispatcher', canExport = S.role === 'ops';
  const approved = rs.filter(r => r.approved && !r.exportId);
  const done = { 1: rs.every(r => r.outcome), 3: rs.length && rs.every(r => r.approved), 4: rs.length && rs.every(r => r.exportId), 5: rs.length === 0 };
  return `<div class="page-head"><div><h1>Closeout and pay</h1><p>No route is paid without an outcome and an approval. Reliability stats and pay come from the same step.</p></div><div class="row small muted">Approve: client admin · Export and mark paid: Gigee ops</div></div>
  <div class="steps">${[['1', 'Mark the result', 'Dispatcher'], ['2', 'Adjust', 'Dispatcher'], ['3', 'Approve', 'Client admin'], ['4', 'Export', 'Gigee ops'], ['5', 'Mark paid', 'Gigee ops']].map(([n, t, w]) => `<div class="step ${done[n] ? 'done' : ''}"><b>${n}. ${t}</b><span class="muted">${w}</span></div>`).join('')}</div>
  ${rs.length ? `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Routes awaiting closeout <span class="muted small">${rs.length}</span></h3><div class="row"><button class="btn sm" onclick="closeoutRoutes().filter(r=>!r.outcome).forEach(r=>setOutcome(r,'Completed'));render()">Mark all Completed</button>${canApprove ? `<button class="btn sm" onclick="closeoutRoutes().filter(r=>r.outcome&&!r.approved).forEach(approve);render();toast('Approved. Payouts locked.')">Approve all with outcomes</button>` : ''}${canExport ? `<button class="btn sm primary" ${approved.length ? '' : 'disabled'} onclick="showExport(exportPay(closeoutRoutes().filter(r=>r.approved&&!r.exportId)))">Export ${approved.length} for pay</button>` : ''}</div></div>
  <div class="tbl"><table><thead><tr><th>Route</th><th>Date</th><th>Driver</th><th class="r">Stops</th><th class="r">Payout</th><th class="r">Fee</th><th class="r">Adj</th><th class="r">Net</th><th>Outcome</th><th>Approval</th><th>Export</th></tr></thead><tbody>
  ${rs.map(r => { const d = driver(r.driverId), o = offer(r.offerId); return `<tr><td><b class="mono">${r.name}</b>${o && o.rescueCover ? '<div><span class="pill completed">Rescue cover</span></div>' : ''}</td><td class="small">${fmtDate(routeDate(r))}</td><td>${d.name}</td><td class="r num">${activeStops(r)}</td><td class="r num">${money(payout(r))}</td><td class="r num">−${money(fee(r))}</td><td class="r num">${money(adjTotal(r))} ${r.approved ? '' : `<button class="btn sm ghost" onclick="openAdj('${r.id}')">+</button>`}</td><td class="r num"><b>${money(net(r))}</b></td>
    <td>${r.approved ? `<span class="pill ${r.outcome === 'Completed' ? 'accepted' : 'rescue'}">${r.outcome}</span>` : `<select onchange="setOutcome(route('${r.id}'),this.value);render()"><option value="" ${!r.outcome ? 'selected' : ''}>Choose</option>${['Completed', 'Incomplete', 'No-show'].map(x => `<option ${r.outcome === x ? 'selected' : ''}>${x}</option>`).join('')}</select>`}</td>
    <td class="small">${r.approved ? `<span class="pill accepted">Locked</span><div class="muted">${r.approved.by}</div>` : canApprove ? `<button class="btn sm" ${r.outcome ? '' : 'disabled'} onclick="approve(route('${r.id}'));render()">Approve</button>` : '<span class="muted">Needs admin</span>'}</td>
    <td class="small mono">${r.exportId || '—'}</td></tr>`; }).join('')}</tbody></table></div></div>` : '<div class="notice ok"><div>All routes closed out and paid.</div></div>'}
  ${S.exports.length ? `<div class="group-title"><h3>Pay exports</h3></div><div class="panel"><div class="tbl"><table><thead><tr><th>Batch</th><th>Range</th><th class="r">Routes</th><th class="r">Total net</th><th>By</th><th>Status</th><th></th></tr></thead><tbody>${S.exports.map(x => `<tr><td class="mono">${x.id}</td><td>${x.range}</td><td class="r num">${x.routeIds.length}</td><td class="r num">${money(x.routeIds.reduce((s, id) => s + net(route(id)), 0))}</td><td>${x.by}</td><td>${x.status === 'paid' ? '<span class="pill accepted">Paid</span>' : '<span class="pill offered">Exported</span>'}</td><td><button class="btn sm" onclick="showExport(S.exports.find(e=>e.id==='${x.id}'))">View</button> ${x.status !== 'paid' && canExport ? `<button class="btn sm primary" onclick="markPaid(S.exports.find(e=>e.id==='${x.id}'));render();toast('Batch marked paid. Stats written back to Airtable.')">Mark paid</button>` : ''}</td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
}
function openAdj(rid) {
  const r = route(rid);
  modal(`<div class="mh"><h2>Adjustment on ${r.name}</h2><button class="btn ghost sm" onclick="closeModal()">Close</button></div><p class="small muted" style="margin:0">Adjustments are their own records. The base payout is never edited.</p>
  <div class="form"><label>Amount (plus or minus)<input id="adjAmt" type="number" step="0.01" value="12.00"></label><label>Reason<select id="adjReason"><option>Extra stops</option><option>Wait time</option><option>Damage</option><option>Other</option></select></label><label style="grid-column:1/-1">Note<input id="adjNote" placeholder="Hub held the driver 40 minutes at pickup"></label></div>
  <div class="mf"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="S.adjustments.push({routeId:'${rid}',amount:Number(document.getElementById('adjAmt').value)||0,reason:document.getElementById('adjReason').value,note:document.getElementById('adjNote').value,by:actorName()});closeModal();render();toast('Adjustment added.')">Add</button></div>`);
}
function showExport(x) {
  const rows = x.routeIds.map(id => { const r = route(id), d = driver(r.driverId); return [d.gid, d.name, r.name, r.date, activeStops(r), payout(r).toFixed(2), fee(r).toFixed(2), adjTotal(r).toFixed(2), net(r).toFixed(2)]; });
  const csv = ['gigee_id,driver_name,route,service_date,stops,proposed_payout,route_fee,adjustments_total,net_payout', ...rows.map(r => r.join(','))].join('\n');
  modal(`<div class="mh"><div><h2>${x.id}</h2><p class="small muted" style="margin:2px 0 0">One row per driver per route. Format to match the existing Gigee payout process (open question in the spec).</p></div><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
  <div class="tbl"><table><thead><tr><th>Gigee ID</th><th>Driver</th><th>Route</th><th>Date</th><th class="r">Stops</th><th class="r">Payout</th><th class="r">Fee</th><th class="r">Adj</th><th class="r">Net</th></tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i >= 4 ? 'r num' : i < 3 ? 'mono' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="mf"><button class="btn" onclick="(navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(csv)}).then(()=>toast('CSV copied.'),()=>toast('Copy blocked here. Select the table instead.')))||toast('Copy not available.')">Copy CSV</button></div>`);
}

function vDrivers() {
  const rows = S.drivers.map(d => ({ d, s: stats(d) })).sort((a, b) => b.s.score - a.s.score);
  return `<div class="page-head"><div><h1>Drivers</h1><p>Profile data is read-only from the Gigee driver table in Airtable. Stats are a rolling 90 days, computed from the offer ledger and written back after each closeout.</p></div><button class="btn" onclick="toast('Airtable sync requested. Up to date.')">Sync now</button></div>
  ${holdSuggestionsHtml()}${holdsPanelHtml()}
  <div class="panel"><div class="tbl"><table><thead><tr><th>Driver</th><th>Area</th><th>Status</th><th class="r">Score</th><th class="r">Offers</th><th class="r">Accept</th><th class="r">Completion</th><th class="r">Late bails</th><th class="r">No-shows</th><th class="r">Confirm</th><th class="r">Rescues</th><th class="r">Avg reply</th><th class="r">Last route</th></tr></thead><tbody>
  ${rows.map(({ d, s }) => `<tr class="clickable" onclick="go('driver',{id:'${d.id}'})"><td><div class="row"><span class="avatar">${initials(d.name)}</span><div><div>${d.name}</div><div class="mono small muted">${d.gid}${d.tier ? ' · Tier ' + d.tier : ''}</div></div></div></td><td class="small">${area(d.area).name}</td><td>${lblHtml(d)}</td><td class="r score">${s.label === 'New' ? '—' : s.score}</td><td class="r num">${s.offers}</td><td class="r num">${Math.round(s.acc * 100)}%</td><td class="r num">${s.committed ? Math.round(s.comp * 100) + '%' : '—'}</td><td class="r num">${s.late}</td><td class="r num">${s.noshow}</td><td class="r num">${s.confSent ? Math.round(s.conf * 100) + '%' : '—'}</td><td class="r num">${s.rescues}</td><td class="r num">${s.respMin} min</td><td class="r num">${s.days === null ? '—' : s.days + ' d'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function vDriver() {
  const d = driver(S.params.id); if (!d) return ''; const s = stats(d);
  const ofs = S.offers.filter(o => o.driverId === d.id && o.sentAt).sort((a, b) => b.sentAt - a.sentAt);
  const m = (k, v) => `<div class="cnt"><div class="v num">${v}</div><div class="k">${k}</div></div>`;
  return `<button class="btn ghost sm" onclick="go('drivers')">← Drivers</button>
  <div class="page-head" style="margin-top:8px"><div><h1>${d.name} ${lblHtml(d)}</h1><p class="mono">${d.gid} · ${phoneFmt(d.phone)} · ${area(d.area).name}${d.tier ? ' · Manual Tier ' + d.tier : ''} · Airtable ${d.rec}</p></div><div class="row"><button class="btn" onclick="S.phoneDriver='${d.id}';document.getElementById('phone').classList.add('open');renderPhone()">Open phone</button>${d.optOut ? `<span class="notice crit small">Texted STOP. Blocked from offers until they text START.</span>` : ''}${!d.active ? `<span class="notice crit small">Inactive in Airtable. Cannot be offered work.</span>` : ''}${d.active ? (onHold(d) ? `<button class="btn" onclick="removeHold('${d.id}')">Remove hold</button>` : `<input id="dHoldReason" placeholder="Reason for a hold" style="min-width:200px"><button class="btn" onclick="putOnHold('${d.id}',$('#dHoldReason').value)">Put on hold</button>`) : ''}</div></div>
  ${onHold(d) ? `<div class="notice crit" style="margin-bottom:12px"><div><b>On hold</b> since ${fmtDT(onHold(d).at)}, set by ${onHold(d).by}: ${esc(onHold(d).reason)}. Skipped in every offer until removed.</div></div>` : ''}
  ${S.holdSuggestions.filter(x => x.driverId === d.id).map(x => `<div class="notice warn" style="margin-bottom:12px"><div><b>Suggested hold:</b> ${esc(x.reason)}. <button class="btn sm primary" style="margin-left:8px" onclick="putOnHold('${d.id}',S.holdSuggestions.find(h=>h.id==='${x.id}').reason,'${x.id}')">Confirm hold</button> <button class="btn sm" onclick="dismissSuggestion('${x.id}')">Dismiss</button></div></div>`).join('')}
  <div class="counts" style="margin-bottom:14px">${m('Score', s.label === 'New' ? '—' : s.score)}${m('Offers (90 d)', s.offers)}${m('Response', Math.round(s.resp * 100) + '%')}${m('Acceptance', Math.round(s.acc * 100) + '%')}${m('Completion', s.committed ? Math.round(s.comp * 100) + '%' : '—')}${m('On-time confirm', s.confSent ? Math.round(s.conf * 100) + '%' : '—')}${m('Late bails', s.late)}${m('No-shows', s.noshow)}${m('Rescues', s.rescues)}${m('Days since route', s.days ?? '—')}</div>
  <div class="two"><div class="panel"><h3>Offer history</h3>${ofs.length ? `<div class="tbl"><table><thead><tr><th>Sent</th><th>Route</th><th>Reply</th><th>Channel</th><th>Outcome</th></tr></thead><tbody>${ofs.map(o => { const r = route(o.routeId); return `<tr class="clickable" onclick="go('route',{id:'${r.id}'})"><td class="small mono">${fmtDT(o.sentAt)}</td><td class="mono">${r.name} <span class="muted small">${fmtDate(routeDate(r))}</span></td><td>${o.reply || (o.open ? '<span class="countdown">waiting</span>' : '—')}</td><td class="small">${o.channel}</td><td>${o.outcome ? `<span class="pill ${o.outcome === 'Completed' ? 'accepted' : ['Late bail', 'No-show'].includes(o.outcome) ? 'rescue' : 'unassigned'}">${o.outcome}</span>` : o.open ? '<span class="pill offered">Open</span>' : '<span class="pill accepted">Active</span>'}</td></tr>`; }).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Earlier offers in the 90-day window are in the base counts above; the Airtable migration question decides whether July history comes over.</p>` : '<p class="muted small">No offers yet.</p>'}</div>
  <div class="stack">
  ${(() => { const mine = S.lanes.map(l => ({ l, n: laneDriverCounts(l)[d.id] || 0, reg: laneRegular(l), up: laneRuns(l).filter(r => r.driverId === d.id && routeStart(r) >= now.getTime()).length })).filter(x => x.n || x.up); return `<div class="panel"><h3>Lanes</h3>${mine.length ? `<div class="tbl"><table><thead><tr><th>Lane</th><th class="r">Runs</th><th>Role</th><th class="r">Upcoming</th></tr></thead><tbody>${mine.map(({ l, n, reg, up }) => `<tr class="clickable" onclick="go('lane',{id:'${l.id}'})"><td>${esc(l.name)}</td><td class="r num">${n}</td><td class="small">${l.preferredDriverId === d.id ? '<span class="pill completed">Preferred</span>' : reg && reg.d.id === d.id ? `<span class="pill accepted">Regular</span> <span class="muted">${reg.n} of ${reg.of}</span>` : '<span class="muted">Covered</span>'}</td><td class="r num">${up}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small" style="margin:0">No completed lane runs in the window.</p>'}</div>`; })()}
  <div class="panel"><h3>Written back to Airtable</h3><dl class="kv"><dt>Offers sent</dt><dd class="num">${s.offers}</dd><dt>Acceptance</dt><dd class="num">${Math.round(s.acc * 100)}%</dd><dt>Completion</dt><dd class="num">${s.committed ? Math.round(s.comp * 100) + '%' : '—'}</dd><dt>Late bails</dt><dd class="num">${s.late}</dd><dt>No-shows</dt><dd class="num">${s.noshow}</dd><dt>Confirm rate</dt><dd class="num">${s.confSent ? Math.round(s.conf * 100) + '%' : '—'}</dd><dt>Score</dt><dd class="num">${s.score}</dd><dt>Status label</dt><dd>${s.label}</dd><dt>Last route</dt><dd>${d.last ? fmtDate(d.last) : '—'}</dd><dt>Last written</dt><dd class="small muted">Nightly 2:00 AM and after each closeout</dd></dl><p class="small muted" style="margin:8px 0 0">Compliance fields stay read-only here. The app never edits them.</p></div></div></div>`;
}

function vLanes() {
  const rows = S.lanes.map(l => { const runs = pastRuns(l); const ran = runs.filter(ranOK); const reg = laneRegular(l); const last = ran.find(r => r.driverId); const up = laneRuns(l).filter(r => routeStart(r) >= now.getTime()); const avg = runs.length ? Math.round(runs.reduce((s, r) => s + activeStops(r), 0) / runs.length) : 0; return { l, runs, ran, reg, last, up, avg }; }).sort((a, b) => a.l.area.localeCompare(b.l.area) || b.runs.length - a.runs.length);
  const mode = { off: 'off', suggest: 'suggest the last driver', auto: 'auto-offer the last driver on import' }[S.settings.laneAuto];
  return `<div class="page-head"><div><h1>Lanes</h1><p>A lane is a route the app has seen before. Onfleet names change daily, so a new route is matched by the stops it shares with a lane's last ${S.settings.laneWindow} runs; ${S.settings.laneThreshold}% or more links it. Lane rule today: <b>${mode}</b>.</p></div><button class="btn" onclick="S.setTab='lanes';go('settings')">Lane settings</button></div>
  <div class="panel"><div class="tbl"><table><thead><tr><th>Lane</th><th>Hub</th><th class="r">Runs</th><th class="r">Avg stops</th><th>Last run</th><th>Regular driver</th><th>Preferred driver</th><th class="r">Upcoming</th></tr></thead><tbody>
  ${rows.map(({ l, runs, reg, last, up, avg }) => `<tr class="clickable" onclick="go('lane',{id:'${l.id}'})"><td><b>${esc(l.name)}</b>${l.fromRun ? `<div class="small muted">new, started by ${l.fromRun}</div>` : ''}</td><td class="small">${area(l.area).hub}</td><td class="r num">${runs.length}</td><td class="r num">${avg || '—'}</td><td class="small">${last ? `${fmtDate(routeDate(last))}<div class="muted">${driver(last.driverId).name}</div>` : '—'}</td><td>${reg ? `<div class="row"><span class="avatar">${initials(reg.d.name)}</span><div>${reg.d.name}<div class="small muted num">${reg.n} of last ${reg.of}</div></div></div>` : '<span class="muted">—</span>'}</td><td onclick="event.stopPropagation()"><select onchange="lane('${l.id}').preferredDriverId=this.value||null;render();toast('Preferred driver saved.')"><option value="">Last driver (default)</option>${S.drivers.filter(d => d.area === l.area).map(d => `<option value="${d.id}" ${l.preferredDriverId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}</select></td><td class="r num">${up.length}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function vLane() {
  const l = lane(S.params.id); if (!l) return '';
  const all = laneRuns(l), past = all.filter(r => routeStart(r) < now.getTime()), upcoming = all.filter(r => routeStart(r) >= now.getTime()).reverse();
  const counts = laneDriverCounts(l), total = Object.values(counts).reduce((s, n) => s + n, 0), share = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const cols = ['var(--accent)', 'var(--info)', 'var(--ok)', 'var(--warn)', 'var(--muted)'];
  const win = past.slice(0, S.settings.laneWindow), freq = {}; win.forEach(r => r.orders.forEach(o => { freq[o.addr] = (freq[o.addr] || 0) + 1; }));
  const addrs = Object.entries(freq).sort((a, b) => b[1] - a[1]);
  const m = (k, v) => `<div class="cnt"><div class="v num">${v}</div><div class="k">${k}</div></div>`;
  const reg = laneRegular(l), a = area(l.area);
  return `<button class="btn ghost sm" onclick="go('lanes')">← Lanes</button>
  <div class="page-head" style="margin-top:8px"><div><h1><input id="laneName" value="${esc(l.name)}" aria-label="Lane name" style="font:inherit;color:inherit;border:0;border-bottom:1px dashed var(--line-strong);background:none;padding:0 2px;width:min(100%,420px)" onchange="lane('${l.id}').name=this.value;toast('Lane renamed.')"></h1><p>${a.name} / ${a.hub} · pickup ${hhmm(a.pickup)} · ${money(a.ppd)} per drop. Edit the title to rename.</p></div></div>
  <div class="counts" style="margin-bottom:14px">${m('Runs', past.length)}${m('Regular driver', reg ? shortName(reg.d) : '—')}${m('Avg stops', past.length ? Math.round(past.reduce((s, r) => s + activeStops(r), 0) / past.length) : '—')}${m('Last run', past[0] ? fmtDate(routeDate(past[0])) : '—')}${m('Upcoming', upcoming.length)}</div>
  <div class="two"><div class="stack">
    <div class="panel"><h3>Who runs it <span class="muted small">last ${S.settings.laneWindow} runs</span></h3>${share.length ? `<div class="share">${share.map(([id, n], i) => `<i style="width:${n / total * 100}%;background:${cols[i % cols.length]}" title="${driver(id).name}: ${n}"></i>`).join('')}</div><div class="tbl" style="margin-top:8px"><table><thead><tr><th>Driver</th><th class="r">Runs</th><th class="r">Share</th><th>Status</th></tr></thead><tbody>${share.map(([id, n], i) => `<tr class="clickable" onclick="go('driver',{id:'${id}'})"><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cols[i % cols.length]};margin-right:6px"></span>${driver(id).name}</td><td class="r num">${n}</td><td class="r num">${Math.round(n / total * 100)}%</td><td>${lblHtml(driver(id))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small" style="margin:0">No completed runs yet.</p>'}
      <div class="row" style="margin-top:10px"><label class="small muted">Preferred driver <select onchange="lane('${l.id}').preferredDriverId=this.value||null;render();toast('Preferred driver saved.')"><option value="">Last driver (default)</option>${S.drivers.filter(d => d.area === l.area).map(d => `<option value="${d.id}" ${l.preferredDriverId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}</select></label></div></div>
    <div class="panel"><h3>Run history</h3><div class="tbl"><table><thead><tr><th>Date</th><th>Route</th><th>Driver</th><th class="r">Stops</th><th class="r">Match</th><th>Outcome</th></tr></thead><tbody>${[...upcoming, ...past].map(r => `<tr class="clickable" onclick="go('route',{id:'${r.id}'})"><td class="small">${fmtDate(routeDate(r))}${routeStart(r) >= now.getTime() ? ' <span class="pill offered">upcoming</span>' : ''}</td><td class="mono">${r.name}</td><td>${r.driverId ? driver(r.driverId).name : '<span class="muted">—</span>'}</td><td class="r num">${activeStops(r)}</td><td class="r num">${laneMatchPct(r) !== null ? laneMatchPct(r) + '%' : r.history ? '<span class="muted">—</span>' : '<span class="muted small">linked</span>'}</td><td>${r.outcome ? `<span class="pill ${r.outcome === 'Completed' ? 'accepted' : 'rescue'}">${r.outcome}</span>` : statusPill(r)}</td></tr>`).join('')}</tbody></table></div></div>
  </div><div class="stack">
    <div class="panel"><h3>Stops that define this lane</h3><p class="small muted" style="margin:0 0 8px">${addrs.length} distinct addresses across the last ${win.length} runs. Runs is how many of them included the stop. A new route is matched against this set.</p><div class="tbl"><table><thead><tr><th>Address</th><th class="r">Runs</th></tr></thead><tbody>${addrs.slice(0, 14).map(([ad, n]) => `<tr><td class="small">${esc(ad)}</td><td class="r num">${n}</td></tr>`).join('')}${addrs.length > 14 ? `<tr><td colspan="2" class="muted small">and ${addrs.length - 14} more</td></tr>` : ''}</tbody></table></div></div>
  </div></div>`;
}

function vSettings() {
  const t = S.settings, w = t.weights; S.setTab = S.setTab || 'areas';
  const tabs = [['areas', 'Areas and pricing'], ['lanes', 'Lanes'], ['templates', 'Message templates'], ['timing', 'Timing rules'], ['weights', 'Score weights'], ['mapping', 'Column mapping'], ['users', 'Users']];
  let body = '';
  if (S.setTab === 'lanes') body = `<div class="panel"><h3>Lane rule</h3><p class="small muted" style="margin:0 0 10px">What the app does when an imported route matches a lane it has seen before.</p>
    <div class="radio" style="max-width:600px">
      <label><input type="radio" name="laneAuto" value="off" ${t.laneAuto === 'off' ? 'checked' : ''} onchange="S.settings.laneAuto='off';render()"><span><b>Off</b><br><span class="small muted">Match lanes and show history, but suggest no one.</span></span></label>
      <label><input type="radio" name="laneAuto" value="suggest" ${t.laneAuto === 'suggest' ? 'checked' : ''} onchange="S.settings.laneAuto='suggest';render()"><span><b>Suggest the last driver</b><br><span class="small muted">One-click Offer button on the board and the route. The dispatcher sends.</span></span></label>
      <label><input type="radio" name="laneAuto" value="auto" ${t.laneAuto === 'auto' ? 'checked' : ''} onchange="S.settings.laneAuto='auto';render()"><span><b>Auto-offer the last driver on import</b><br><span class="small muted">The moment an import creates a recognized route, the offer text goes to the suggested driver. If they decline or let it expire, the route returns to Unassigned for the dispatcher (an automatic next-best queue is Phase 3). Never texts during quiet hours; waits for 7:00 AM.</span></span></label>
    </div>
    <div class="form" style="margin-top:14px"><label>Match threshold (% of a route's stops seen on the lane)<input type="number" min="1" max="100" value="${t.laneThreshold}" onchange="S.settings.laneThreshold=Number(this.value);relinkAll();render();toast('Routes re-matched.')"></label><label>History window (runs per lane)<input type="number" min="1" value="${t.laneWindow}" onchange="S.settings.laneWindow=Number(this.value);relinkAll();render()"></label><label>Drivers on Watch<select onchange="S.settings.laneSkipWatch=this.value==='1';render()"><option value="1" ${t.laneSkipWatch ? 'selected' : ''}>Skip, fall back to the next driver</option><option value="0" ${t.laneSkipWatch ? '' : 'selected'}>Suggest them anyway</option></select></label></div>
    <p class="small muted" style="margin:12px 0 0">Suggestion order: the lane's preferred driver if one is set, then the driver of the most recent run, then the one before, and so on. A driver is skipped when inactive in Airtable, opted out, on hold, booked that day, holding an open offer, or when they bailed or passed on this same route. A route that matches nothing becomes a new lane the first time it completes; a dispatcher can also link or unlink any route by hand, and later matches learn from that.</p></div>`;
  if (S.setTab === 'areas') body = `<div class="panel"><div class="tbl"><table><thead><tr><th>Area</th><th>Hub</th><th>Price per drop</th><th>Pickup time</th><th>Pickup address</th><th>Driver instructions</th></tr></thead><tbody>${S.areas.map(a => `<tr><td><b>${a.name}</b></td><td>${a.hub}</td><td><input type="number" step="0.25" value="${a.ppd.toFixed(2)}" style="width:90px" onchange="area('${a.id}').ppd=Number(this.value);toast('Unapproved payouts in ${a.name} recalculated.');render()"></td><td><input type="time" value="${a.pickup}" onchange="area('${a.id}').pickup=this.value;render()"></td><td class="small">${a.address}</td><td class="small">${a.instr}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Route fee: greater of <input type="number" value="${t.feeMin}" style="width:60px" onchange="S.settings.feeMin=Number(this.value);render()"> dollars or <input type="number" value="${t.feePct}" style="width:50px" onchange="S.settings.feePct=Number(this.value);render()">% of proposed payout. A setting, not code.</p></div>`;
  if (S.setTab === 'templates') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Offer texts show a stop range, never an exact count or a per-drop rate. Range width <input type="number" min="1" value="${t.stopRange}" style="width:56px" onchange="S.settings.stopRange=Number(this.value);toast('Range saved. Next offer reads About '+stopRange(13)+' stops for a 13-stop route.')"> stops. Merge fields: {date} {start_time} {hub} {stop_range} {stops} {payout} {expiry} {route_name} {pickup_address} {instructions} {support_contact}. Edits apply to the next text sent.</p><div class="stack">${Object.entries(t.templates).map(([k, v]) => `<label class="small muted" style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">${k}</span><textarea rows="2" class="mono" style="color:var(--fg)" onchange="S.settings.templates['${k}']=this.value;toast('Template saved.')">${esc(v)}</textarea></label>`).join('')}</div></div>`;
  if (S.setTab === 'timing') body = `<div class="panel"><div class="form"><label>Offer expiry (min)<input type="number" value="${t.expiry}" onchange="S.settings.expiry=Number(this.value);toast('Expiry saved.')"></label><label>Reconfirm (hours before start)<input type="number" value="${t.reconfirmHours}" onchange="S.settings.reconfirmHours=Number(this.value)"></label><label>Reconfirm reply window (min)<input type="number" value="${t.reconfirmWindow}" onchange="S.settings.reconfirmWindow=Number(this.value)"></label><label>Final confirm (hours before start)<input type="number" value="${t.finalHours}" onchange="S.settings.finalHours=Number(this.value)"></label><label>Final reply window (min)<input type="number" value="${t.finalWindow}" onchange="S.settings.finalWindow=Number(this.value)"></label><label>Quiet hours<input value="${t.quietStart} to ${t.quietEnd}"></label><label>Late bail threshold (hours)<input type="number" value="24"></label><label>Support contact<input value="${t.support}" onchange="S.settings.support=this.value"></label><label>Staffing bench (% over routes)<input type="number" value="${t.benchPct}" onchange="S.settings.benchPct=Number(this.value);render()"></label><label>When a site marks a no-show<select onchange="S.settings.noShowRescue=this.value"><option value="auto" ${t.noShowRescue === 'auto' ? 'selected' : ''}>Flag Rescue and offer to the next best driver</option><option value="flag" ${t.noShowRescue === 'flag' ? 'selected' : ''}>Flag Rescue only, dispatcher offers</option></select></label></div><p class="small muted" style="margin:10px 0 0">Starts before 8:00 AM get their final confirm at 6:00 PM the evening before. All times in the hub's time zone (America/Chicago).</p></div>`;
  if (S.setTab === 'weights') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Score = completion × ${w.completion} + acceptance × ${w.acceptance} + on-time confirm × ${w.confirm} + ${w.perRoute} per completed route (max ${w.perRouteMax}) + ${w.perRescue} per rescue (max ${w.perRescueMax}) ${w.early} per early release ${w.late} per late bail ${w.noshow} per no-show + tier bump (A +${w.tierA}, B +${w.tierB}). Changing a weight recomputes every driver.</p><div class="form">${Object.entries(w).map(([k, v]) => `<label>${k}<input type="number" value="${v}" onchange="S.settings.weights['${k}']=Number(this.value);render();toast('Scores recomputed.')"></label>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Labels: New under 5 offers · No routes yet · Watch (2+ no-shows, 3+ late bails, or completion under 85%) · Solid 85 to 94% · Reliable 95% and up.</p></div>`;
  if (S.setTab === 'mapping') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Saved for Logiscal from the Oct 6 upload. Mapped again only when the columns change.</p><div class="tbl"><table><thead><tr><th>App field</th><th>OpenFleet column</th><th>Required</th></tr></thead><tbody>${[['Order ID', 'order_number', 'Yes'], ['Service date', 'delivery_date', 'Yes'], ['Delivery address', 'address_line_1 + city + state + zip', 'Yes'], ['Area or hub', 'depot', 'Yes'], ['Onfleet route ID', 'onfleet_route', 'Yes'], ['Route start time', 'route_start', 'No'], ['Customer name', 'recipient_name', 'No'], ['Customer phone', 'recipient_phone', 'No'], ['Package count', 'package_qty', 'No'], ['Order status', 'status', 'No']].map(r => `<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="small">${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`;
  if (S.setTab === 'users') body = `<div class="panel"><div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Client</th></tr></thead><tbody>${[['Dana Ruiz', 'dana@logiscal.com', 'Dispatcher', 'Logiscal'], ['Chris Ambrose', 'chris@logiscal.com', 'Dispatcher', 'Logiscal'], ['Mike Patel', 'mike@logiscal.com', 'Client admin', 'Logiscal'], ['Ruston', 'ruston@gigee.com', 'Gigee ops', 'All clients']].map(r => `<tr><td>${r[0]}</td><td class="mono small">${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Every query is scoped to the user's client. Gigee ops sees all clients.</p></div>`;
  return `<div class="page-head"><div><h1>Settings</h1><p>Entered once, reused everywhere. Client admin and Gigee ops only.</p></div></div><div class="tabs">${tabs.map(([id, n]) => `<button class="${S.setTab === id ? 'active' : ''}" onclick="S.setTab='${id}';render()">${n}</button>`).join('')}</div>${body}`;
}

/* ---------------- Phone ---------------- */
function renderPhone() {
  const d = driver(S.phoneDriver) || S.drivers[0];
  const ms = S.messages.filter(m => m.driverId === d.id).sort((a, b) => a.time - b.time);
  const open = S.offers.find(o => o.driverId === d.id && o.open);
  const pend = S.offers.find(o => o.driverId === d.id && o.pending);
  const el = $('#phone');
  el.innerHTML = `<div class="phone-head"><div class="row" style="justify-content:space-between"><span class="eyebrow">Driver phone · simulator</span><button class="btn sm ghost menu-btn" style="color:var(--phone-fg)" onclick="document.getElementById('phone').classList.remove('open')">Close</button></div>
    <select aria-label="Which driver's phone" onchange="S.phoneDriver=this.value;renderPhone()">${S.drivers.map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${x.name} · ${phoneFmt(x.phone)}</option>`).join('')}</select>
    <div class="small" style="color:#8d9aa7">Texts from Gigee (512) 555-0100${d.optOut ? ' · <span style="color:#f08a80">opted out</span>' : ''}${open ? ` · <span style="color:#8fb2f0">open offer, <span data-countdown="${open.id}">${Math.ceil((open.expiresAt - now.getTime()) / 60000)} min left</span></span>` : ''}</div></div>
    <div class="phone-thread" id="thread">${ms.length ? ms.map(m => `<div class="bubble ${m.dir}">${esc(m.body)}<span class="mt">${fmtTime(m.time)}${m.status === 'failed' ? ' · not delivered' : ''}</span></div>`).join('') : '<div class="sys">No texts yet</div>'}</div>
    <div class="phone-reply"><div class="quick">
      <button class="yes" onclick="inbound(driver('${d.id}'),'YES')">YES</button><button onclick="inbound(driver('${d.id}'),'NO')">NO</button><button onclick="inbound(driver('${d.id}'),'what time is pickup?')">Something else</button><button onclick="inbound(driver('${d.id}'),'${d.optOut ? 'START' : 'STOP'}')">${d.optOut ? 'START' : 'STOP'}</button>
      ${open ? `<button onclick="expireOffer(offer('${open.id}'));render()">Stay silent ${S.settings.expiry} min</button>` : ''}
      ${pend && !open ? `<button onclick="silentOnCheck(route('${pend.routeId}'))">Stay silent</button>` : ''}
    </div><form onsubmit="event.preventDefault();const i=this.querySelector('input');if(i.value.trim()){inbound(driver('${d.id}'),i.value);i.value=''}"><input id="phoneInput" placeholder="Type a reply"><button class="send" type="submit">Send</button></form>
    <div class="hint">Replies go through the Twilio webhook, match the sender by phone, then land on this driver's open offer or confirmation.</div></div>`;
  const th = $('#thread'); th.scrollTop = th.scrollHeight;
}

$('#role').addEventListener('change', e => { S.role = e.target.value; render(); toast(`Now acting as ${actorName()}.`); });
$('#phoneToggle').addEventListener('click', () => $('#phone').classList.toggle('open'));
$('#clock').textContent = `${fmtDate(now)} · ${fmtTime(now)}`;
render();
</script>
</body>
</html>
