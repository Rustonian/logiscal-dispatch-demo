function adjPanel(r) {
  const xs = adjs(r); if (!xs.length && !canAdjust(r)) return '';
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">Adjustments</h3>${canAdjust(r) ? `<button class="btn sm" onclick="openAdj('${r.id}')">Adjust route</button>` : ''}</div>${xs.length ? `<div class="tbl"><table><thead><tr><th>When</th><th>Who</th><th class="r">Stops</th><th class="r">Pay</th><th>Reason</th></tr></thead><tbody>${xs.map(a => `<tr><td class="small mono">${a.at ? fmtDT(a.at) : ''}</td><td class="small">${a.by}</td><td class="r num">${a.stops ? (a.stops > 0 ? '+' : '') + a.stops : '–'}</td><td class="r num">${money(a.amount)}</td><td class="small">${esc(a.reason)}${a.note ? `<div class="muted">${esc(a.note)}</div>` : ''}${a.texted ? '<div class="muted">Driver texted</div>' : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small muted" style="margin:0">Added stops or pay in Onfleet after this route came in? Record it here instead of uploading another file.</p>'}</div>`;
}
function showExport(x) {
  const rows = x.routeIds.map(id => { const r = route(id), d = driver(r.driverId); return [d.gid, d.name, r.name, r.date, routeStops(r), payout(r).toFixed(2), fee(r).toFixed(2), adjTotal(r).toFixed(2), net(r).toFixed(2)]; });
  const csv = ['gigee_id,driver_name,route,service_date,stops,proposed_payout,route_fee,adjustments_total,net_payout', ...rows.map(r => r.join(','))].join('\n');
  modal(`<div class="mh"><div><h2>${x.id}</h2><p class="small muted" style="margin:2px 0 0">One row per driver per route. Format to match the existing Gigee payout process (open question in the spec).</p></div><button class="btn ghost sm" onclick="closeModal()">Close</button></div>
  <div class="tbl"><table><thead><tr><th>Gigee ID</th><th>Driver</th><th>Route</th><th>Date</th><th class="r">Stops</th><th class="r">Payout</th><th class="r">Fee</th><th class="r">Adj</th><th class="r">Net</th></tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i >= 4 ? 'r num' : i < 3 ? 'mono' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="mf"><button class="btn" onclick="(navigator.clipboard&&navigator.clipboard.writeText(${JSON.stringify(csv)}).then(()=>toast('CSV copied.'),()=>toast('Copy blocked here. Select the table instead.')))||toast('Copy not available.')">Copy CSV</button></div>`);
}

function vDrivers() {
  const rows = S.drivers.map(d => ({ d, s: stats(d) })).sort((a, b) => b.s.score - a.s.score);
  return `<div class="page-head"><div><h1>Drivers</h1><p>Profile data is read-only from the Gigee driver table in Airtable. Stats are a rolling 90 days, computed from the offer ledger and written back after each closeout.</p></div><button class="btn" onclick="toast('Airtable sync requested. Up to date.')">Sync now</button></div>
  <div class="panel"><div class="tbl"><table><thead><tr><th>Driver</th><th>Area</th><th>Status</th><th class="r">Score</th><th class="r">Offers</th><th class="r">Accept</th><th class="r">Completion</th><th class="r">Late bails</th><th class="r">No-shows</th><th class="r">Confirm</th><th class="r">Rescues</th><th class="r">Avg reply</th><th class="r">Last route</th></tr></thead><tbody>
  ${rows.map(({ d, s }) => `<tr class="clickable" onclick="go('driver',{id:'${d.id}'})"><td><div class="row"><span class="avatar">${initials(d.name)}</span><div><div>${d.name}</div><div class="mono small muted">${d.gid}${d.tier ? ' · Tier ' + d.tier : ''}</div></div></div></td><td class="small">${area(d.area).name}</td><td>${lblHtml(d)}</td><td class="r score">${s.label === 'New' ? '–' : s.score}</td><td class="r num">${s.offers}</td><td class="r num">${Math.round(s.acc * 100)}%</td><td class="r num">${s.committed ? Math.round(s.comp * 100) + '%' : '–'}</td><td class="r num">${s.late}</td><td class="r num">${s.noshow}</td><td class="r num">${s.confSent ? Math.round(s.conf * 100) + '%' : '–'}</td><td class="r num">${s.rescues}</td><td class="r num">${s.respMin} min</td><td class="r num">${s.days === null ? '–' : s.days + ' d'}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function vDriver() {
  const d = driver(S.params.id); if (!d) return ''; const s = stats(d);
  const ofs = S.offers.filter(o => o.driverId === d.id && o.sentAt).sort((a, b) => b.sentAt - a.sentAt);
  const m = (k, v) => `<div class="cnt"><div class="v num">${v}</div><div class="k">${k}</div></div>`;
  return `<button class="btn ghost sm" onclick="go('drivers')">← Drivers</button>
  <div class="page-head" style="margin-top:8px"><div><h1>${d.name} ${lblHtml(d)}</h1><p class="mono">${d.gid} · ${phoneFmt(d.phone)} · ${area(d.area).name}${d.tier ? ' · Manual Tier ' + d.tier : ''} · Airtable ${d.rec}</p></div><div class="row"><button class="btn" onclick="S.phoneDriver='${d.id}';document.getElementById('phone').classList.add('open');renderPhone()">Open phone</button>${d.optOut ? `<span class="notice crit small">Texted STOP. Blocked from offers until they text START.</span>` : ''}${!d.active ? `<span class="notice crit small">Inactive in Airtable. Cannot be offered work.</span>` : ''}</div></div>
  <div class="counts" style="margin-bottom:14px">${m('Score', s.label === 'New' ? '–' : s.score)}${m('Offers (90 d)', s.offers)}${m('Response', Math.round(s.resp * 100) + '%')}${m('Acceptance', Math.round(s.acc * 100) + '%')}${m('Completion', s.committed ? Math.round(s.comp * 100) + '%' : '–')}${m('On-time confirm', s.confSent ? Math.round(s.conf * 100) + '%' : '–')}${m('Late bails', s.late)}${m('No-shows', s.noshow)}${m('Rescues', s.rescues)}${m('Days since route', s.days ?? '–')}</div>
  <div class="two"><div class="panel"><h3>Offer history</h3>${ofs.length ? `<div class="tbl"><table><thead><tr><th>Sent</th><th>Route</th><th>Reply</th><th>Channel</th><th>Outcome</th></tr></thead><tbody>${ofs.map(o => { const r = route(o.routeId); return `<tr class="clickable" onclick="go('route',{id:'${r.id}'})"><td class="small mono">${fmtDT(o.sentAt)}</td><td class="mono">${r.name} <span class="muted small">${fmtDate(routeDate(r))}</span></td><td>${o.reply || (o.open ? '<span class="countdown">waiting</span>' : '–')}</td><td class="small">${o.channel}</td><td>${o.outcome ? `<span class="pill ${o.outcome === 'Completed' ? 'accepted' : ['Late bail', 'No-show'].includes(o.outcome) ? 'rescue' : 'unassigned'}">${o.outcome}</span>` : o.open ? '<span class="pill offered">Open</span>' : '<span class="pill accepted">Active</span>'}</td></tr>`; }).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Earlier offers in the 90-day window are in the base counts above; the Airtable migration question decides whether July history comes over.</p>` : '<p class="muted small">No offers yet.</p>'}</div>
  <div class="stack">
  ${(() => { const mine = S.lanes.map(l => ({ l, n: laneDriverCounts(l)[d.id] || 0, reg: laneRegular(l), up: laneRuns(l).filter(r => r.driverId === d.id && routeStart(r) >= now.getTime()).length })).filter(x => x.n || x.up); return `<div class="panel"><h3>Lanes</h3>${mine.length ? `<div class="tbl"><table><thead><tr><th>Lane</th><th class="r">Runs</th><th>Role</th><th class="r">Upcoming</th></tr></thead><tbody>${mine.map(({ l, n, reg, up }) => `<tr class="clickable" onclick="go('lane',{id:'${l.id}'})"><td>${esc(l.name)}</td><td class="r num">${n}</td><td class="small">${l.preferredDriverId === d.id ? '<span class="pill completed">Preferred</span>' : reg && reg.d.id === d.id ? `<span class="pill accepted">Regular</span> <span class="muted">${reg.n} of ${reg.of}</span>` : '<span class="muted">Covered</span>'}</td><td class="r num">${up}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small" style="margin:0">No completed lane runs in the window.</p>'}</div>`; })()}
  <div class="panel"><h3>Written back to Airtable</h3><dl class="kv"><dt>Offers sent</dt><dd class="num">${s.offers}</dd><dt>Acceptance</dt><dd class="num">${Math.round(s.acc * 100)}%</dd><dt>Completion</dt><dd class="num">${s.committed ? Math.round(s.comp * 100) + '%' : '–'}</dd><dt>Late bails</dt><dd class="num">${s.late}</dd><dt>No-shows</dt><dd class="num">${s.noshow}</dd><dt>Confirm rate</dt><dd class="num">${s.confSent ? Math.round(s.conf * 100) + '%' : '–'}</dd><dt>Score</dt><dd class="num">${s.score}</dd><dt>Status label</dt><dd>${s.label}</dd><dt>Last route</dt><dd>${d.last ? fmtDate(d.last) : '–'}</dd><dt>Last written</dt><dd class="small muted">Nightly 2:00 AM and after each closeout</dd></dl><p class="small muted" style="margin:8px 0 0">Compliance fields stay read-only here. The app never edits them.</p></div></div></div>`;
}

function vLanes() {
  const rows = S.lanes.map(l => { const runs = pastRuns(l); const ran = runs.filter(ranOK); const reg = laneRegular(l); const last = ran.find(r => r.driverId); const up = laneRuns(l).filter(r => routeStart(r) >= now.getTime()); const avg = runs.length ? Math.round(runs.reduce((s, r) => s + activeStops(r), 0) / runs.length) : 0; return { l, runs, ran, reg, last, up, avg }; }).sort((a, b) => a.l.area.localeCompare(b.l.area) || b.runs.length - a.runs.length);
  const mode = { off: 'off', suggest: 'suggest the last driver', auto: 'auto-offer the last driver on import' }[S.settings.laneAuto];
  return `<div class="page-head"><div><h1>Lanes</h1><p>A lane is a route the app has seen before. Onfleet names change daily, so a new route is matched by the stops it shares with a lane's last ${S.settings.laneWindow} runs; ${S.settings.laneThreshold}% or more links it. Lane rule today: <b>${mode}</b>.</p></div><button class="btn" onclick="S.setTab='lanes';go('settings')">Lane settings</button></div>
  <div class="panel"><div class="tbl"><table><thead><tr><th>Lane</th><th>Hub</th><th class="r">Runs</th><th class="r">Avg stops</th><th>Last run</th><th>Regular driver</th><th>Preferred driver</th><th class="r">Upcoming</th></tr></thead><tbody>
  ${rows.map(({ l, runs, reg, last, up, avg }) => `<tr class="clickable" onclick="go('lane',{id:'${l.id}'})"><td><b>${esc(l.name)}</b>${l.fromRun ? `<div class="small muted">new, started by ${l.fromRun}</div>` : ''}</td><td class="small">${area(l.area).hub}</td><td class="r num">${runs.length}</td><td class="r num">${avg || '–'}</td><td class="small">${last ? `${fmtDate(routeDate(last))}<div class="muted">${driver(last.driverId).name}</div>` : '–'}</td><td>${reg ? `<div class="row"><span class="avatar">${initials(reg.d.name)}</span><div>${reg.d.name}<div class="small muted num">${reg.n} of last ${reg.of}</div></div></div>` : '<span class="muted">–</span>'}</td><td onclick="event.stopPropagation()"><select onchange="lane('${l.id}').preferredDriverId=this.value||null;render();toast('Preferred driver saved.')"><option value="">Last driver (default)</option>${S.drivers.filter(d => d.area === l.area).map(d => `<option value="${d.id}" ${l.preferredDriverId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}</select></td><td class="r num">${up.length}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function vLane() {
  const l = lane(S.params.id); if (!l) return '';
  const all = laneRuns(l), past = all.filter(r => routeStart(r) < now.getTime()), upcoming = all.filter(r => routeStart(r) >= now.getTime()).reverse();
  const counts = laneDriverCounts(l), total = Object.values(counts).reduce((s, n) => s + n, 0), share = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const cols = ['var(--accent)', 'var(--info)', 'var(--ok)', 'var(--warn)', 'var(--muted)'];
  const win = past.slice(0, S.settings.laneWindow), freq = {}; win.forEach(r => r.orders.forEach(o => { freq[o.addr] = (freq[o.addr] || 0) + 1; }));
  const addrs = Object.entries(freq).sort((a, b) => b[1] - a[1]);
  const m = (k, v) => `<div class="cnt"><div class="v num">${v}</div><div class="k">${k}</div></div>`;
  const reg = laneRegular(l), a = area(l.area);
  return `<button class="btn ghost sm" onclick="go('lanes')">← Lanes</button>
  <div class="page-head" style="margin-top:8px"><div><h1><input id="laneName" value="${esc(l.name)}" aria-label="Lane name" style="font:inherit;color:inherit;border:0;border-bottom:1px dashed var(--line-strong);background:none;padding:0 2px;width:min(100%,420px)" onchange="lane('${l.id}').name=this.value;toast('Lane renamed.')"></h1><p>${a.name} / ${a.hub} · pickup ${hhmm(a.pickup)} · ${money(a.ppd)} per drop. Edit the title to rename.</p></div></div>
  <div class="counts" style="margin-bottom:14px">${m('Runs', past.length)}${m('Regular driver', reg ? shortName(reg.d) : '–')}${m('Avg stops', past.length ? Math.round(past.reduce((s, r) => s + activeStops(r), 0) / past.length) : '–')}${m('Last run', past[0] ? fmtDate(routeDate(past[0])) : '–')}${m('Upcoming', upcoming.length)}</div>
  <div class="two"><div class="stack">
    <div class="panel"><h3>Who runs it <span class="muted small">last ${S.settings.laneWindow} runs</span></h3>${share.length ? `<div class="share">${share.map(([id, n], i) => `<i style="width:${n / total * 100}%;background:${cols[i % cols.length]}" title="${driver(id).name}: ${n}"></i>`).join('')}</div><div class="tbl" style="margin-top:8px"><table><thead><tr><th>Driver</th><th class="r">Runs</th><th class="r">Share</th><th>Status</th></tr></thead><tbody>${share.map(([id, n], i) => `<tr class="clickable" onclick="go('driver',{id:'${id}'})"><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cols[i % cols.length]};margin-right:6px"></span>${driver(id).name}</td><td class="r num">${n}</td><td class="r num">${Math.round(n / total * 100)}%</td><td>${lblHtml(driver(id))}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small" style="margin:0">No completed runs yet.</p>'}
      <div class="row" style="margin-top:10px"><label class="small muted">Preferred driver <select onchange="lane('${l.id}').preferredDriverId=this.value||null;render();toast('Preferred driver saved.')"><option value="">Last driver (default)</option>${S.drivers.filter(d => d.area === l.area).map(d => `<option value="${d.id}" ${l.preferredDriverId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}</select></label></div></div>
    <div class="panel"><h3>Run history</h3><div class="tbl"><table><thead><tr><th>Date</th><th>Route</th><th>Driver</th><th class="r">Stops</th><th class="r">Match</th><th>Outcome</th></tr></thead><tbody>${[...upcoming, ...past].map(r => `<tr class="clickable" onclick="go('route',{id:'${r.id}'})"><td class="small">${fmtDate(routeDate(r))}${routeStart(r) >= now.getTime() ? ' <span class="pill offered">upcoming</span>' : ''}</td><td class="mono">${r.name}</td><td>${r.driverId ? driver(r.driverId).name : '<span class="muted">–</span>'}</td><td class="r num">${activeStops(r)}</td><td class="r num">${laneMatchPct(r) !== null ? laneMatchPct(r) + '%' : r.history ? '<span class="muted">–</span>' : '<span class="muted small">linked</span>'}</td><td>${r.outcome ? `<span class="pill ${r.outcome === 'Completed' ? 'accepted' : 'rescue'}">${r.outcome}</span>` : statusPill(r)}</td></tr>`).join('')}</tbody></table></div></div>
  </div><div class="stack">
    <div class="panel"><h3>Stops that define this lane</h3><p class="small muted" style="margin:0 0 8px">${addrs.length} distinct addresses across the last ${win.length} runs. Runs is how many of them included the stop. A new route is matched against this set.</p><div class="tbl"><table><thead><tr><th>Address</th><th class="r">Runs</th></tr></thead><tbody>${addrs.slice(0, 14).map(([ad, n]) => `<tr><td class="small">${esc(ad)}</td><td class="r num">${n}</td></tr>`).join('')}${addrs.length > 14 ? `<tr><td colspan="2" class="muted small">and ${addrs.length - 14} more</td></tr>` : ''}</tbody></table></div></div>
  </div></div>`;
}

function vSettings() {
  const t = S.settings, w = t.weights; S.setTab = S.setTab || 'areas';
  const tabs = [['areas', 'Areas and hubs'], ['lanes', 'Lanes'], ['templates', 'Message templates'], ['timing', 'Timing rules'], ['weights', 'Score weights'], ['mapping', 'Column mapping'], ['users', 'Users']];
  let body = '';
  if (S.setTab === 'lanes') body = `<div class="panel" style="margin-bottom:12px"><h3>Driver already set in Onfleet</h3><p class="small muted" style="margin:0 0 10px">When a route arrives with a driver on it in Onfleet, that driver is the preferred driver. The app still texts them to confirm.</p>
    <div class="radio" style="max-width:600px"><label><input type="radio" name="pre" ${t.preConfirm === 'click' ? 'checked' : ''} onchange="S.settings.preConfirm='click';render()"><span><b>One-click confirm (default)</b><br><span class="small muted">Nothing is texted on upload. The dispatcher sends each confirm from the board.</span></span></label><label><input type="radio" name="pre" ${t.preConfirm === 'auto' ? 'checked' : ''} onchange="S.settings.preConfirm='auto';render()"><span><b>Text them to confirm on import</b><br><span class="small muted">Confirm text with exact pay, stop range, cities, miles and hours. Never during quiet hours.</span></span></label></div>
    <div class="form" style="margin-top:12px"><label>Confirm reply window (min)<input type="number" value="${t.preConfirmWindow}" onchange="S.settings.preConfirmWindow=Number(this.value)"></label><label>Recognize old routes by<select onchange="S.settings.laneKey=this.value;relinkAll();render();toast('Routes re-matched.')"><option value="addr" ${t.laneKey === 'addr' ? 'selected' : ''}>Delivery address</option><option value="name" ${t.laneKey === 'name' ? 'selected' : ''}>Address or customer name</option></select></label></div><p class="small muted" style="margin:10px 0 0">Address matching ignores the apartment number. Customer name helps when a subscriber moves within the same area.</p></div><div class="panel"><h3>Lane rule</h3><p class="small muted" style="margin:0 0 10px">What the app does when an imported route matches a lane it has seen before.</p>
    <div class="radio" style="max-width:600px">
      <label><input type="radio" name="laneAuto" value="off" ${t.laneAuto === 'off' ? 'checked' : ''} onchange="S.settings.laneAuto='off';render()"><span><b>Off</b><br><span class="small muted">Match lanes and show history, but suggest no one.</span></span></label>
      <label><input type="radio" name="laneAuto" value="suggest" ${t.laneAuto === 'suggest' ? 'checked' : ''} onchange="S.settings.laneAuto='suggest';render()"><span><b>Suggest the last driver</b><br><span class="small muted">One-click Offer button on the board and the route. The dispatcher sends.</span></span></label>
      <label><input type="radio" name="laneAuto" value="auto" ${t.laneAuto === 'auto' ? 'checked' : ''} onchange="S.settings.laneAuto='auto';render()"><span><b>Auto-offer the last driver on import</b><br><span class="small muted">The moment an import creates a recognized route, the offer text goes to the suggested driver. If they decline or let it expire, the route returns to Unassigned for the dispatcher (an automatic next-best queue is Phase 3). Never texts during quiet hours; waits for 7:00 AM.</span></span></label>
    </div>
    <div class="form" style="margin-top:14px"><label>Match threshold (% of a route's stops seen on the lane)<input type="number" min="1" max="100" value="${t.laneThreshold}" onchange="S.settings.laneThreshold=Number(this.value);relinkAll();render();toast('Routes re-matched.')"></label><label>History window (runs per lane)<input type="number" min="1" value="${t.laneWindow}" onchange="S.settings.laneWindow=Number(this.value);relinkAll();render()"></label><label>Drivers on Watch<select onchange="S.settings.laneSkipWatch=this.value==='1';render()"><option value="1" ${t.laneSkipWatch ? 'selected' : ''}>Skip, fall back to the next driver</option><option value="0" ${t.laneSkipWatch ? '' : 'selected'}>Suggest them anyway</option></select></label></div>
    <p class="small muted" style="margin:12px 0 0">Suggestion order: the lane's preferred driver if one is set, then the driver of the most recent run, then the one before, and so on. A driver is skipped when inactive in Airtable, opted out, booked that day, holding an open offer, or when they bailed or passed on this same route. A route that matches nothing becomes a new lane the first time it completes; a dispatcher can also link or unlink any route by hand, and later matches learn from that.</p></div>`;
  if (S.setTab === 'areas') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Pay rates and pricing parameters moved to <a style="cursor:pointer" onclick="go('markets')">Markets and pricing</a>.</p><div class="tbl"><table><thead><tr><th>Area</th><th>Hub</th><th>Market</th><th>Pickup time</th><th>Pickup address</th><th>Driver instructions</th></tr></thead><tbody>${S.areas.map(a => `<tr><td><b>${a.name}</b></td><td>${a.hub}</td><td>${market(a.market).name}${a.facility ? `<div class="small muted mono">facility ${a.facility}</div>` : ''}</td><td><input type="time" value="${a.pickup}" onchange="area('${a.id}').pickup=this.value;render()"></td><td class="small">${a.address}</td><td class="small">${a.instr}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Route fee: greater of <input type="number" value="${t.feeMin}" style="width:60px" onchange="S.settings.feeMin=Number(this.value);render()"> dollars or <input type="number" value="${t.feePct}" style="width:50px" onchange="S.settings.feePct=Number(this.value);render()">% of proposed payout. A setting, not code.</p></div>`;
  if (S.setTab === 'templates') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Offer texts show a stop range, never an exact count or a per-drop rate. Range width <input type="number" min="1" value="${t.stopRange}" style="width:56px" onchange="S.settings.stopRange=Number(this.value);toast('Range saved. Next offer reads About '+stopRange(13)+' stops for a 13-stop route.')"> stops. Merge fields: {date} {start_time} {hub} {stop_range} {route_detail} {stops} {payout} {expiry} {route_name} {pickup_address} {instructions} {support_contact}. Edits apply to the next text sent.</p><div class="stack">${Object.entries(t.templates).map(([k, v]) => `<label class="small muted" style="display:flex;flex-direction:column;gap:4px"><span class="eyebrow">${k}</span><textarea rows="2" class="mono" style="color:var(--fg)" onchange="S.settings.templates['${k}']=this.value;toast('Template saved.')">${esc(v)}</textarea></label>`).join('')}</div></div>`;
  if (S.setTab === 'timing') body = `<div class="panel"><div class="form"><label>Offer expiry (min)<input type="number" value="${t.expiry}" onchange="S.settings.expiry=Number(this.value);toast('Expiry saved.')"></label><label>Reconfirm (hours before start)<input type="number" value="${t.reconfirmHours}" onchange="S.settings.reconfirmHours=Number(this.value)"></label><label>Reconfirm reply window (min)<input type="number" value="${t.reconfirmWindow}" onchange="S.settings.reconfirmWindow=Number(this.value)"></label><label>Final confirm (hours before start)<input type="number" value="${t.finalHours}" onchange="S.settings.finalHours=Number(this.value)"></label><label>Final reply window (min)<input type="number" value="${t.finalWindow}" onchange="S.settings.finalWindow=Number(this.value)"></label><label>Quiet hours<input value="${t.quietStart} to ${t.quietEnd}"></label><label>Late bail threshold (hours)<input type="number" value="24"></label><label>Support contact<input value="${t.support}" onchange="S.settings.support=this.value"></label><label>Staffing bench (% over routes)<input type="number" value="${t.benchPct}" onchange="S.settings.benchPct=Number(this.value);render()"></label><label>When a site marks a no-show<select onchange="S.settings.noShowRescue=this.value"><option value="auto" ${t.noShowRescue === 'auto' ? 'selected' : ''}>Flag Rescue and offer to the next best driver</option><option value="flag" ${t.noShowRescue === 'flag' ? 'selected' : ''}>Flag Rescue only, dispatcher offers</option></select></label></div><p class="small muted" style="margin:10px 0 0">Starts before 8:00 AM get their final confirm at 6:00 PM the evening before. All times in the hub's time zone (America/Chicago).</p></div>`;
  if (S.setTab === 'weights') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Score = completion × ${w.completion} + acceptance × ${w.acceptance} + on-time confirm × ${w.confirm} + ${w.perRoute} per completed route (max ${w.perRouteMax}) + ${w.perRescue} per rescue (max ${w.perRescueMax}) ${w.early} per early release ${w.late} per late bail ${w.noshow} per no-show + tier bump (A +${w.tierA}, B +${w.tierB}). Changing a weight recomputes every driver.</p><div class="form">${Object.entries(w).map(([k, v]) => `<label>${k}<input type="number" value="${v}" onchange="S.settings.weights['${k}']=Number(this.value);render();toast('Scores recomputed.')"></label>`).join('')}</div><p class="small muted" style="margin:10px 0 0">Labels: New under 5 offers · No routes yet · Watch (2+ no-shows, 3+ late bails, or completion under 85%) · Solid 85 to 94% · Reliable 95% and up.</p></div>`;
  if (S.setTab === 'mapping') body = `<div class="panel"><p class="small muted" style="margin:0 0 10px">Mapped from the Onfleet task export (Oct 15 CookUnity file). Mapped again only when the columns change.</p><div class="tbl"><table><thead><tr><th>App field</th><th>Onfleet column</th><th>Required</th></tr></thead><tbody>${[['Route (one per Onfleet driver slot)', 'Driver Number', 'Yes'], ['Order ID', 'orderId, else shortId', 'Yes'], ['Delivery address', 'destinationAddress', 'Yes'], ['Hub and market', 'facilityId, else workerName suffix (INDY_LOGISCAL)', 'Yes'], ['Service date', 'shippingDate, else completeAfterTime', 'Yes'], ['Driver already in Onfleet', 'workerName', 'No'], ['Stop order', 'Task Number', 'No'], ['Coordinates (miles and hours)', 'destinationLonLat', 'No'], ['Delivery window', 'completeAfterTime to completeBeforeTime', 'No'], ['Order type (B2B extra)', 'orderType', 'No'], ['Customer name', 'recipientsNames', 'No'], ['Package count', 'quantity', 'No'], ['Skipped', 'rows where taskType is not dropoff (hub start)', '']].map(r => `<tr><td>${r[0]}</td><td class="mono">${r[1]}</td><td class="small">${r[2]}</td></tr>`).join('')}</tbody></table></div></div>`;
  if (S.setTab === 'users') body = `<div class="panel"><div class="tbl"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Client</th><th>Pricing</th></tr></thead><tbody>${S.users.map(u => `<tr><td>${u.name}</td><td class="mono small">${u.email}</td><td>${u.role}</td><td>${u.client}</td><td class="small">${['Client admin', 'Gigee ops'].includes(u.role) ? 'Sees pricing' : 'No'}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">Every query is scoped to the user's client. Gigee ops sees all clients.</p></div>`;
  return `<div class="page-head"><div><h1>Settings</h1><p>Entered once, reused everywhere. Client admin and Gigee ops only.</p></div></div><div class="tabs">${tabs.map(([id, n]) => `<button class="${S.setTab === id ? 'active' : ''}" onclick="S.setTab='${id}';render()">${n}</button>`).join('')}</div>${body}`;
}

/* ---------------- Phone ---------------- */
function renderPhone() {
  const d = driver(S.phoneDriver) || S.drivers[0];
  if (!d) { $('#phone').innerHTML = `<div class="phone-head"><div class="row" style="justify-content:space-between"><span class="eyebrow">Driver phone · simulator</span><button class="btn sm ghost menu-btn" style="color:var(--phone-fg)" onclick="document.getElementById('phone').classList.remove('open')">Close</button></div></div><div class="phone-thread"><div class="sys">No drivers yet. Add the drivers on your file from the upload preview, then their texts show here.</div></div>`; return; }
  const ms = S.messages.filter(m => m.driverId === d.id).sort((a, b) => a.time - b.time);
  const open = S.offers.find(o => o.driverId === d.id && o.open);
  const pend = S.offers.find(o => o.driverId === d.id && o.pending);
  const el = $('#phone');
  el.innerHTML = `<div class="phone-head"><div class="row" style="justify-content:space-between"><span class="eyebrow">Driver phone · simulator</span><button class="btn sm ghost menu-btn" style="color:var(--phone-fg)" onclick="document.getElementById('phone').classList.remove('open')">Close</button></div>
    <select aria-label="Which driver's phone" onchange="S.phoneDriver=this.value;renderPhone()">${S.drivers.map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${x.name} · ${phoneFmt(x.phone)}</option>`).join('')}</select>
    <div class="small" style="color:#8d9aa7">Texts from Logiscal (512) 555-0100${d.optOut ? ' · <span style="color:#f08a80">opted out</span>' : ''}${open ? ` · <span style="color:#8fb2f0">open offer, <span data-countdown="${open.id}">${Math.ceil((open.expiresAt - now.getTime()) / 60000)} min left</span></span>` : ''}</div></div>
    <div class="phone-thread" id="thread">${ms.length ? ms.map(m => `<div class="bubble ${m.dir}">${esc(m.body)}<span class="mt">${new Date(m.time).toDateString() === now.toDateString() ? fmtTime(m.time) : fmtDT(m.time)}${m.status === 'failed' ? ' · not delivered' : ''}</span></div>`).join('') : '<div class="sys">No texts yet</div>'}</div>
    <div class="phone-reply"><div class="quick">
      <button class="yes" onclick="inbound(driver('${d.id}'),'YES')">YES</button><button onclick="inbound(driver('${d.id}'),'NO')">NO</button><button onclick="inbound(driver('${d.id}'),'what time is pickup?')">Something else</button><button onclick="inbound(driver('${d.id}'),'${d.optOut ? 'START' : 'STOP'}')">${d.optOut ? 'START' : 'STOP'}</button>
      ${open ? `<button onclick="expireOffer(offer('${open.id}'));render()">Stay silent ${Math.round((open.expiresAt - open.sentAt) / 60000)} min</button>` : ''}
      ${pend && !open ? `<button onclick="silentOnCheck(route('${pend.routeId}'))">Stay silent</button>` : ''}
    </div><form onsubmit="event.preventDefault();const i=this.querySelector('input');if(i.value.trim()){inbound(driver('${d.id}'),i.value);i.value=''}"><input id="phoneInput" placeholder="Type a reply"><button class="send" type="submit">Send</button></form>
    <div class="hint">Replies go through the Twilio webhook, match the sender by phone, then land on this driver's open offer or confirmation.</div></div>`;
  const th = $('#thread'); th.scrollTop = th.scrollHeight;
}

$('#role').addEventListener('change', e => { S.role = e.target.value; render(); toast(`Now acting as ${actorName()}.`); });
$('#phoneToggle').addEventListener('click', () => $('#phone').classList.toggle('open'));
$('#clock').textContent = `${fmtDate(now)} · ${fmtTime(now)}`;
render();
</script>
</body>
</html>
