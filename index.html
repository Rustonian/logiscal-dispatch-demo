<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logiscal Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ops console. Fixed top bar, left nav, working board in the middle, a simulated driver phone docked right. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --fg:#18222c; --muted:#5f6c79; --line:#d5dce4; --line-strong:#b9c3cd;
  --accent:#0d5c78; --accent-fg:#ffffff; --accent-soft:#dcedf3;
  --ok:#1d7a4c; --ok-bg:#dff3e7; --warn:#a85f00; --warn-bg:#fdecd2; --crit:#b4352b; --crit-bg:#fbe1de; --info:#2a5db0; --info-bg:#dfe8f8;
  --phone-bg:#0f1316; --phone-fg:#eef2f5; --bubble-out:#1d6f8a; --bubble-in:#2a323a;
  --display:"Barlow","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#171d23; --surface-2:#1d242b; --fg:#e4eaf0; --muted:#95a3b1; --line:#2a333c; --line-strong:#3b4650;
  --accent:#4fb0cf; --accent-fg:#071219; --accent-soft:#163340;
  --ok:#5ccb8c; --ok-bg:#13301f; --warn:#f0b454; --warn-bg:#3a2a0c; --crit:#f08a80; --crit-bg:#3d1a17; --info:#8fb2f0; --info-bg:#1a2a45;
  --phone-bg:#05080a; --phone-fg:#eef2f5; --bubble-out:#1d6f8a; --bubble-in:#262e36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#171d23; --surface-2:#1d242b; --fg:#e4eaf0; --muted:#95a3b1; --line:#2a333c; --line-strong:#3b4650;
  --accent:#4fb0cf; --accent-fg:#071219; --accent-soft:#163340;
  --ok:#5ccb8c; --ok-bg:#13301f; --warn:#f0b454; --warn-bg:#3a2a0c; --crit:#f08a80; --crit-bg:#3d1a17; --info:#8fb2f0; --info-bg:#1a2a45;
  --phone-bg:#05080a; --phone-fg:#eef2f5; --bubble-out:#1d6f8a; --bubble-in:#262e36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:22px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
a{color:var(--accent)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:200px 1fr 330px;grid-template-rows:52px 1fr;height:100%;min-height:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.01em}
.brand .client{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:8px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-left:auto}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.role{display:flex;align-items:center;gap:6px;font-size:12px}
.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
.side button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--fg)}
.side button:hover{background:var(--surface-2)}
.side button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .count{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .count.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.side .count.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.side .group{padding:14px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
main{overflow:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.phone-dock{background:var(--phone-bg);color:var(--phone-fg);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:10px;padding:0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.chip b{font-family:var(--mono);font-weight:500}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.unassigned{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.offered{background:var(--info-bg);color:var(--info)}
.pill.accepted{background:var(--ok-bg);color:var(--ok)}
.pill.attention{background:var(--warn-bg);color:var(--warn)}
.pill.completed{background:var(--accent-soft);color:var(--accent)}
.pill.cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.rescue{background:var(--crit);color:#fff}
.lbl{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
.lbl.Reliable{background:var(--ok-bg);color:var(--ok)}
.lbl.Solid{background:var(--info-bg);color:var(--info)}
.lbl.Watch{background:var(--warn-bg);color:var(--warn)}
.lbl.New,.lbl.Noroutes{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.lbl.Opted{background:var(--crit-bg);color:var(--crit)}
.lbl.Inactive{background:var(--crit-bg);color:var(--crit)}
.lbl.Hold{background:var(--crit-bg);color:var(--crit)}
.ci{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px}
.ci.Arrived{background:var(--ok-bg);color:var(--ok)}.ci.Late{background:var(--warn-bg);color:var(--warn)}.ci.Noshow{background:var(--crit);color:#fff}.ci.Waiting{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.checkin-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.checkin-row:first-child{border-top:0}
.checkin-btns{display:flex;gap:6px;flex-wrap:wrap}
.health td.st{white-space:nowrap}

.group-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.group-title .n{font-family:var(--mono);color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card.rescue{border-left:4px solid var(--crit)}
.card.attention{border-left:4px solid var(--warn)}
.ofc{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap;cursor:pointer}.ofc.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.ofc.bad{background:var(--crit-bg);color:var(--crit);border-color:transparent;font-weight:600}.ofc.todo{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.card .title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .rn{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.01em}
.card .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.card .meta b{color:var(--fg);font-weight:500;font-family:var(--mono)}
.card .driver{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;flex:none}
.card .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.card .cline{font-size:12px;color:var(--muted)}
.card .cline.ok{color:var(--ok)}
.card .cline.warn{color:var(--warn)}
.card .cline.crit{color:var(--crit);font-weight:500}
.card .onf-tick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;padding:3px 8px;border:1px solid var(--line);border-radius:6px;user-select:none}
.card .onf-tick:hover{border-color:var(--accent);color:var(--fg)}
.board-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);flex:none}
.seg button{background:none;border:0;padding:5px 12px;font:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(205px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px}
.kcol-h .n{font-family:var(--mono);color:var(--muted);font-size:12px}
.kcol-b{display:flex;flex-direction:column;gap:8px}
.kcol .card{padding:10px 12px}
.kcol .card .actions{flex-wrap:wrap}
.kempty{color:var(--muted);font-size:12px;text-align:center;padding:14px 0;border:1px dashed var(--line);border-radius:var(--radius)}
.bsec{margin-bottom:10px}
.bsec-h{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;cursor:pointer;font:inherit;color:var(--fg);text-align:left}
.bsec-h:hover{border-color:var(--accent)}
.bsec-h .chev{width:12px;color:var(--muted)}
.bsec-h .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bsec:not(.shut) .bsec-h{border-radius:var(--radius) var(--radius) 0 0;border-bottom:0}
.tbl-wrap{border:1px solid var(--line);border-radius:0 0 var(--radius) var(--radius);overflow-x:auto;background:var(--surface)}
.btable tr{cursor:pointer}
.btable tbody tr:hover td{background:var(--surface-2)}
.btable tr:last-child td{border-bottom:0}
.btable tr.rescue td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.btable tr.attention td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.btable .rn{font-family:var(--display);font-weight:700;font-size:15px}
.btable{table-layout:fixed;min-width:760px}
.btable td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;padding-top:10px;padding-bottom:10px}
.btable td.st,.btable td.wrap{white-space:normal}
.btable td.act{overflow:visible}
.btable .acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btable .acts:empty{display:none}
.bsec.empty .bsec-h{opacity:.7}
.kcol .card .driver{flex-wrap:wrap;gap:6px}
.btable td.num,.btable th.num{text-align:right}
.btable td.st{font-size:12px}
.btable td.st .cline{font-size:12px;color:var(--muted)}.btable td.st .cline.ok{color:var(--ok)}.btable td.st .cline.warn{color:var(--warn)}.btable td.st .cline.crit{color:var(--crit);font-weight:500}
.btable .onf-tick.on{color:var(--ok);border-color:var(--ok)}
.btable .onf-tick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;padding:3px 8px;border:1px solid var(--line);border-radius:6px;white-space:nowrap}
.card .onf-tick.on{color:var(--ok);border-color:var(--ok)}
.card .onf-tick input{margin:0;cursor:pointer}
.countdown{font-family:var(--mono);font-size:12px;color:var(--info)}
.countdown.low{color:var(--crit)}
.pickup-in{font-family:var(--mono);font-size:12px;color:var(--crit);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.panel h3{margin-bottom:8px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pay{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px}
.pay .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:10px}
.timeline .t{font-family:var(--mono);color:var(--muted)}
.notice{border-radius:var(--radius);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.mk-tbl td.flag{background:var(--warn-bg);color:var(--warn);font-weight:600}.mk-tbl td.bad{background:var(--crit-bg);color:var(--crit);font-weight:600}.mk-tbl tr{cursor:pointer}.mk-tbl tr:hover td{background:var(--surface-2)}.mk-tbl tr:hover td.flag{background:var(--warn-bg)}.mk-tbl tr:hover td.bad{background:var(--crit-bg)}.mk-tbl th,.mk-tbl td{white-space:nowrap;padding-left:8px;padding-right:8px}.mk-tbl th:first-child,.mk-tbl td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.notice.crit{background:var(--crit-bg);color:var(--crit)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.thread{display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:7px 10px;border-radius:12px;font-size:13px;line-height:1.35}
.msg.out{align-self:flex-start;background:var(--accent-soft);color:var(--fg);border-bottom-left-radius:3px}
.msg.in{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-bottom-right-radius:3px}
.msg .mt{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.msg.failed{border:1px dashed var(--crit)}

/* phone */
.phone-head{padding:12px 14px;border-bottom:1px solid #222a31;display:flex;flex-direction:column;gap:6px}
.phone-head .eyebrow{color:#8d9aa7}
.phone-head select{background:#1a2127;color:var(--phone-fg);border-color:#2d363e;width:100%}
.phone-thread{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.phone-thread .bubble{max-width:86%;padding:8px 11px;border-radius:16px;font-size:13px;line-height:1.35}
.phone-thread .bubble.out{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px}
.phone-thread .bubble.in{align-self:flex-end;background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px}
.phone-thread .bubble .mt{display:block;font-family:var(--mono);font-size:10px;opacity:.6;margin-top:3px}
.phone-thread .sys{align-self:center;font-size:11px;color:#8d9aa7;text-align:center;padding:2px 8px}
.phone-reply{padding:10px 14px;border-top:1px solid #222a31;display:flex;flex-direction:column;gap:8px}
.phone-reply .quick{display:flex;gap:6px;flex-wrap:wrap}
.phone-reply .quick button{background:#1a2127;color:var(--phone-fg);border:1px solid #2d363e;border-radius:14px;padding:5px 11px;cursor:pointer;font-size:12px}
.phone-reply .quick button:hover{background:#242d35}
.phone-reply .quick button.yes{background:#1d6f8a;border-color:transparent}
.phone-reply form{display:flex;gap:6px}
.phone-reply input{flex:1;background:#1a2127;color:var(--phone-fg);border-color:#2d363e;border-radius:16px;padding:7px 12px;min-width:0}
.phone-reply .send{background:#1d6f8a;color:#fff;border:0;border-radius:16px;padding:7px 12px;cursor:pointer}
.phone-reply .hint{font-size:11px;color:#8d9aa7}

/* upload */
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);background:var(--surface)}
.drop .files{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cnt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.cnt .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.cnt .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.cnt.new .v{color:var(--ok)}.cnt.changed .v{color:var(--info)}.cnt.missing .v{color:var(--warn)}.cnt.rejected .v{color:var(--crit)}
.diff{font-family:var(--mono);font-size:12px}
.diff .old{text-decoration:line-through;color:var(--muted)}
.diff .new{color:var(--info)}

/* modal */

function withdraw(r) { const o = offer(r.offerId); o.open = false; o.outcome = 'Withdrawn'; ev(o.id, 'Withdrawn', actorName(), 'Does not count against driver'); r.status = 'Unassigned'; r.driverId = null; r.offerId = null; r.lockedPay = null; sendSms(driver(o.driverId), fill(S.settings.templates.expired, r), r, o); toast('Offer withdrawn.'); render(); }

function checkinRoutes() { return S.routes.filter(r => dayOffset(r) === 0 && r.status !== 'Cancelled' && !r.history && (r.driverId || r.checkin || r.noShow)).sort((a, b) => routeStart(a) - routeStart(b)); }

/* ---------------- Coverage ---------------- */
function staffing(dayOff, areaIds) {
  return areaIds.map(aid => {
    const rs = S.routes.filter(r => r.area === aid && !r.history && r.status !== 'Cancelled' && dayOffset(r) === dayOff);
    const pool = S.drivers.filter(d => d.area === aid && d.active && !d.optOut);

    const target = Math.ceil(rs.length * (1 + S.settings.benchPct / 100));
    const open = rs.filter(r => ['Unassigned', 'Offered', 'Needs attention'].includes(r.status)).length;
    const bench = pool.filter(d => !booked.has(d.id)).length;
    const date = rs[0] ? rs[0].date : null;
    const req = date && S.recruitRequests.find(x => x.area === aid && x.date === date);
    return { a: area(aid), routes: rs.length, target, active: pool.length, booked: booked.size, bench, open, short: Math.max(0, target - pool.length), date, req };

}
function requestRecruiting(aid, date, n) { S.recruitRequests.push({ area: aid, date, n, by: actorName(), at: now.getTime() }); toast(`Recruiting request sent to Gigee ops: ${n} driver${n > 1 ? 's' : ''} for ${area(aid).name}.`); render(); }

  </tbody></table></div></div><p class="small muted" style="margin:8px 0 0">Bench % is set in Settings, Timing rules.</p>`;

function actorName() { return { dispatcher: 'Dana Ruiz', admin: 'Mike Patel', lead: 'Terri Lang', ops: 'Ruston' }[S.role]; }

function inbound(d, text) {
  const t = text.trim(); const up = t.toUpperCase();
  const m = mkMsg({ dir: 'in', driverId: d.id, body: t });
  if (up === 'STOP') { d.optOut = true; m.kind = 'optout'; toast(`${d.name} opted out. Blocked from offers until START.`); render(); return; }
  if (up === 'START') { d.optOut = false; m.kind = 'optin'; sendSms(d, 'You are opted back in to Logiscal route texts.', null, null); toast(`${d.name} opted back in.`); render(); return; }

  const open = S.offers.find(o => o.driverId === d.id && o.open);
  const pend = S.offers.find(o => o.driverId === d.id && o.pending && route(o.routeId).driverId === d.id);
  if (open) { m.offerId = open.id; m.routeId = open.routeId; if (yes) acceptOffer(open); else if (no) declineOffer(open); else { m.kind = 'other'; sendSms(d, fill(S.settings.templates.help, route(open.routeId), d), route(open.routeId), open); toast('Unrecognized reply. Help text sent; it shows in the route text history.'); } render(); return; }

    if (yes) { if (pend.pending === 'reconfirm') pend.reconfirmedAt = now.getTime(); else if (pend.pending === 'final') pend.finalConfirmedAt = now.getTime(); ev(pend.id, pend.pending === 'change' ? 'Kept after change' : (pend.pending === 'reconfirm' ? 'Reconfirmed' : 'Final confirmed'), 'Driver', 'SMS'); pend.pending = null; if (r.status === 'Needs attention') { r.status = 'Accepted'; r.attention = null; } toast(`${d.name} confirmed ${r.name}.`); }
    else if (no) { pend.pending = null; release(r, 'Driver'); return; }
    else { m.kind = 'other'; sendSms(d, fill(S.settings.templates.help, r, d), r, pend); toast('Unrecognized reply. Help text sent; it shows in the route text history.'); }
    render(); return;
  }
  // YES/NO with nothing open
  if (yes || no) { const lastO = S.offers.filter(o => o.driverId === d.id && o.sentAt).sort((a, b) => b.sentAt - a.sentAt)[0]; if (lastO) { m.offerId = lastO.id; m.routeId = lastO.routeId; } m.kind = 'late'; sendSms(d, fill(S.settings.templates.expired, lastO ? route(lastO.routeId) : S.routes[0], d), null, null); toast(`${d.name} replied with no open offer. Told the route is closed.`); render(); return; }
  m.kind = 'other'; sendSms(d, fill(S.settings.templates.help, S.routes[0], d), null, null); toast('Unrecognized text. Help text sent.'); render();
}

/* ---------------- Lanes: route recognition and history ---------------- */
function lane(id) { return S.lanes.find(l => l.id === id); }
function addrKey(a) { return a.toLowerCase().replace(/[^a-z0-9]/g, ''); }
function laneRuns(l, excludeId) { return S.routes.filter(r => r.laneId === l.id && r.id !== excludeId && r.status !== 'Cancelled').sort((a, b) => routeStart(b) - routeStart(a)); }
function pastRuns(l, excludeId) { return laneRuns(l, excludeId).filter(r => routeStart(r) < now.getTime()).slice(0, S.settings.laneWindow); }
function ranOK(r) { return r.outcome === 'Completed' || (!r.outcome && routeStart(r) < now.getTime() && r.status === 'Accepted'); }
function stopKey(o) { return o.key || addrKey(o.addr); }
function lanePoolKeys(l, excludeId) { const set = new Set(), names = new Set(); pastRuns(l, excludeId).forEach(r => r.orders.forEach(o => { set.add(stopKey(o)); if (o.nk) names.add(o.nk); })); set.names = names; return set; }
function routeKeys(r) { const m = new Map(); r.orders.filter(o => o.status === 'active').forEach(o => { if (!m.has(stopKey(o))) m.set(stopKey(o), o.nk || ''); }); return [...m.entries()]; }
function matchLane(r) {
  const keys = routeKeys(r); let best = null;
  for (const l of S.lanes) {
    if (l.area !== r.area) continue; const pool = lanePoolKeys(l, r.id); if (!pool.size) continue;
    const seen = keys.filter(([k, nk]) => pool.has(k) || (S.settings.laneKey === 'name' && nk && pool.names.has(nk))).length, pct = keys.length ? seen / keys.length : 0;
    if (!best || pct > best.pct) best = { laneId: l.id, pct, seen, total: keys.length };
  }
  return best;
}
function relink(r) { r.laneMatch = matchLane(r); if (!r.laneManual) r.laneId = r.laneMatch && r.laneMatch.pct * 100 >= S.settings.laneThreshold ? r.laneMatch.laneId : null; }
function relinkAll() { S.routes.filter(r => !r.history).forEach(relink); }
function laneMatchPct(r) { return r.laneMatch && r.laneMatch.laneId === r.laneId ? Math.round(r.laneMatch.pct * 100) : null; }
function laneDriverCounts(l, excludeId) { const c = {}; pastRuns(l, excludeId).filter(r => r.driverId && ranOK(r)).forEach(r => c[r.driverId] = (c[r.driverId] || 0) + 1); return c; }
function laneRegular(l, excludeId) { const c = laneDriverCounts(l, excludeId); const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; return top ? { d: driver(top[0]), n: top[1], of: pastRuns(l, excludeId).filter(ranOK).length } : null; }
function laneSuggestion(r) {
  const l = lane(r.laneId); if (!l) return null;
  const runs = pastRuns(l, r.id).filter(x => x.driverId && ranOK(x));
  const counts = laneDriverCounts(l, r.id), cands = [], seen = new Set();
  if (l.preferredDriverId) { seen.add(l.preferredDriverId); cands.push({ d: driver(l.preferredDriverId), why: 'preferred driver for this lane', n: counts[l.preferredDriverId] || 0 }); }
  for (const x of runs) { if (seen.has(x.driverId)) continue; seen.add(x.driverId); cands.push({ d: driver(x.driverId), why: `last ran it ${fmtDate(routeDate(x))}${x.outcome ? '' : ' (awaiting closeout)'}`, n: counts[x.driverId] || 0 }); }
  cands.forEach(c => { c.blocked = eligibility(c.d, r); if (S.settings.laneSkipWatch && c.d.active && stats(c.d).label === 'Watch') c.blocked.push('Watch status'); });
  const pick = cands.find(c => !c.blocked.length) || null;
  return { lane: l, runs, cands, pick, regular: laneRegular(l, r.id) };
}
function shortName(d) { const p = d.name.split(' '); return `${p[0]} ${p[1][0]}.`; }
function autoOffer(rs) {
  const out = { sent: [], skipped: [] };
  for (const r of rs.filter(x => x.status === 'Unassigned' && x.laneId).sort((a, b) => routeStart(a) - routeStart(b))) {
    const s = laneSuggestion(r);
    if (!s.pick) { out.skipped.push(`${r.name} (${s.cands.length ? s.cands.map(c => `${c.d.name.split(' ')[0]}: ${c.blocked[0].toLowerCase()}`).join(', ') : 'no past driver'})`); continue; }
    offerRoute(r, s.pick.d, 'sms', { auto: true, silent: true }); out.sent.push(`${r.name} to ${s.pick.d.name}`);
  }
  return out;
}
function runAutoOffer(ids) { const o = autoOffer(ids.map(route)); render(); toast(o.sent.length ? `Auto-offered ${o.sent.length}: ${o.sent.join('; ')}.` : 'Nothing to auto-offer.'); if (o.skipped.length) setTimeout(() => toast(`Skipped ${o.skipped.join('; ')}.`), 400); }
relinkAll();

/* ---------------- Markets and pricing ---------------- */
const ROAD = 1.25; // straight-line miles to road miles
function market(id) { return S.markets.find(m => m.id === id); }
function areaMarket(aid) { return market(area(aid).market); }
function me() { return S.users.find(u => u.key === S.role) || S.users[0]; }
function canSeePricing() { return ['admin', 'ops'].includes(S.role); } // Markets and pricing: admins only
function hv(a, b) { const R = 3958.8, r = x => x * Math.PI / 180; const dLa = r(b[0] - a[0]), dLo = r(b[1] - a[1]); const x = Math.sin(dLa / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
function geoStats(r) {
  const a = area(r.area); const os = r.orders.filter(o => o.status === 'active' && o.lat != null).sort((x, y) => (x.seq || 0) - (y.seq || 0));
  if (!os.length || a.lat == null) return null;
  const first = hv([a.lat, a.lon], [os[0].lat, os[0].lon]) * ROAD; let miles = first;
  for (let i = 1; i < os.length; i++) miles += hv([os[i - 1].lat, os[i - 1].lon], [os[i].lat, os[i].lon]) * ROAD;
  const cc = {}; os.forEach(o => { if (o.city) cc[o.city] = (cc[o.city] || 0) + 1; });
  const cities = Object.entries(cc).sort((x, y) => y[1] - x[1]).slice(0, 2).map(x => x[0]);
  return { first, miles, cities, apt: os.filter(o => o.apt).length, b2b: os.filter(o => o.type === 'b2b').length };
}
// One formula for the calculator and for real routes. f = { n, apt, b2b, miles, first } (miles null when the route has no coordinates)
function priceCore(m, ppd, f, last) {
  const p = m.p, lines = []; let pay = f.n * ppd;
  lines.push([`${f.n} drops × ${money(ppd)} base`, f.n * ppd]);
  let hours = null;
  if (f.miles != null) {
    if (f.b2b && p.b2bBonus) { lines.push([`${f.b2b} B2B drops × ${money(p.b2bBonus)}`, f.b2b * p.b2bBonus]); pay += f.b2b * p.b2bBonus; }
    if (f.apt && p.aptBonus) { lines.push([`${f.apt} apartment or unit stops × ${money(p.aptBonus)}`, f.apt * p.aptBonus]); pay += f.apt * p.aptBonus; }
    const over = Math.max(0, f.miles - p.includedMiles); if (over && p.mileRate) { lines.push([`${Math.round(over)} miles over ${p.includedMiles} × ${money(p.mileRate)}`, over * p.mileRate]); pay += over * p.mileRate; }
    const fo = Math.max(0, f.first - p.firstLegFree); if (fo && p.firstLegRate) { lines.push([`First leg ${Math.round(f.first)} mi, ${Math.round(fo)} over ${p.firstLegFree} × ${money(p.firstLegRate)}`, fo * p.firstLegRate]); pay += fo * p.firstLegRate; }
    hours = p.loadMin / 60 + f.miles / p.avgMph + f.n * p.minPerStop / 60;
  }
  const floorPay = hours && p.floor ? hours * p.floor : 0;
  if (floorPay > pay) { lines.push([`Hourly floor top-up to ${money(p.floor)}/hr for ${hours.toFixed(1)} h`, floorPay - pay]); pay = floorPay; }
  let glide = null;
  if (last && f.miles != null && p.glidePct) {

  const cancelled = all.filter(r => r.status === 'Cancelled');
  const rescuePill = r => isRescue(r) ? '<span class="pill rescue">Rescue</span>' : '';
  const actions = r => {
    const d = driver(r.driverId), s = suggest && r.status === 'Unassigned' && r.laneId ? laneSuggestion(r) : null;
    return `${r.status === 'Unassigned' && r.onfleetDriverId && !eligibility(driver(r.onfleetDriverId), r).length ? `<button class="btn sm primary" title="Onfleet already has this driver on the route" onclick="confirmOnfleet(route('${r.id}'),driver('${r.onfleetDriverId}'),false)">Confirm with ${shortName(driver(r.onfleetDriverId))}</button><button class="btn sm" onclick="openPicker('${r.id}','sms')">Other driver</button>` : r.status === 'Unassigned' ? (s && s.pick ? `<button class="btn sm primary" title="${esc(s.pick.why)}" onclick="offerRoute(route('${r.id}'),driver('${s.pick.d.id}'),'sms')">Offer to ${shortName(s.pick.d)}</button><button class="btn sm" onclick="openPicker('${r.id}','sms')">Other driver</button>` : `<button class="btn sm primary" onclick="openPicker('${r.id}','sms')">Offer</button>`) : ''}
        ${r.status === 'Offered' ? `<button class="btn sm" onclick="withdraw(route('${r.id}'))">Withdraw</button>` : ''}
        ${r.status === 'Needs attention' ? `<button class="btn sm primary" onclick="go('route',{id:'${r.id}'})">Decide</button>` : ''}
        ${r.status === 'Accepted' && d ? `<label class="onf-tick ${r.onfleet ? 'on' : ''}" title="Tick once you've assigned ${esc(d.name)} to this route in Onfleet"><input type="checkbox" ${r.onfleet ? 'checked' : ''} onchange="route('${r.id}').onfleet=this.checked;render()"> Assigned in Onfleet</label>` : ''}`;
  };
  const notes = r => `${isRescue(r) ? `<div class="pickup-in" data-pickup="${r.id}">Pickup in ${dur(routeStart(r) - now.getTime())}</div>` : ''}
      ${r.attention && !/^Silent on/.test(r.attention) ? `<div class="small" style="color:var(--warn)">${r.attention}</div>` : ''}
      ${r.noShow && !r.driverId ? `<div class="small" style="color:var(--crit)">${driver(r.noShow.driverId).name} no-show at ${fmtTime(r.noShow.at)}</div>` : ''}`;
  const edge = r => isRescue(r) ? 'rescue' : r.status === 'Needs attention' ? 'attention' : '';
  const stopsHtml = r => `<b>${routeStops(r)}</b> stops${adjStops(r) ? ` <span class="muted">(${adjStops(r) > 0 ? '+' : ''}${adjStops(r)} adj)</span>` : ''}`;
  const geo = r => geoStats(r) ? (() => { const pr = price(r); return `${Math.round(pr.miles)} mi · ${pr.hours.toFixed(1)} h`; })() : r.vehicle;
  const countdown = r => { const o = r.status === 'Offered' && r.offerId && offer(r.offerId); return o ? `<span class="countdown" data-countdown="${o.id}">${Math.ceil((o.expiresAt - now.getTime()) / 60000)} min left</span>` : ''; };

  const card = r => `<div class="card ${edge(r)}" onclick="go('route',{id:'${r.id}'})">
      <div class="title"><span class="rn">${r.name}</span>${rescuePill(r)}</div>
      <div class="meta"><span>${area(r.area).hub}</span><span><b>${showDate ? fmtDate(routeDate(r)) + ' ' : ''}${hhmm(r.start)}</b></span><span>${stopsHtml(r)}</span><span><b>${money(driverPay(r))}</b></span><span>${geo(r)}</span></div>
      ${laneLine(r)}
      ${notes(r)}
      <div class="driver">${driver(r.driverId) ? `<span class="avatar">${initials(driver(r.driverId).name)}</span><span>${driver(r.driverId).name}</span>${lblHtml(driver(r.driverId))}` : '<span class="muted small">No driver</span>'}</div>
      ${countdown(r) || ciTag(r) ? `<div class="row" style="gap:8px">${countdown(r)}${ciTag(r)}</div>` : ''}
      ${confirmLine(r)}
      <div class="actions" onclick="event.stopPropagation()">${actions(r)}</div></div>`;

  const kanban = () => `<div class="kanban">${BOARD_COLS.map(c => { const rs = colRoutes(c); return `<div class="kcol k-${c.toLowerCase()}"><div class="kcol-h"><span class="pill ${c.toLowerCase()}">${c}</span><span class="n">${rs.length}</span></div><div class="kcol-b">${rs.length ? rs.map(card).join('') : '<div class="kempty">None</div>'}</div></div>`; }).join('')}</div>`;

  const row = r => { const d = driver(r.driverId); return `<tr class="${edge(r)}" onclick="go('route',{id:'${r.id}'})">
      <td><span class="rn">${r.name}</span>${isRescue(r) ? '<div>' + rescuePill(r) + '</div>' : ''}</td>
      <td class="wrap">${area(r.area).hub}</td>
      <td class="mono">${showDate ? fmtDate(routeDate(r)) + '<br>' : ''}${hhmm(r.start)}</td>
      <td>${stopsHtml(r)}<div class="muted small">${geo(r)}</div></td>
      <td class="num mono">${money(driverPay(r))}</td>
      <td class="wrap">${d ? `<span class="row" style="gap:6px;flex-wrap:nowrap"><span class="avatar">${initials(d.name)}</span><span>${d.name}</span></span>` : '<span class="muted small">No driver</span>'}</td>
      <td class="st">${countdown(r) || ciTag(r) ? `<div class="row" style="gap:6px">${countdown(r)}${ciTag(r)}</div>` : ''}${confirmLine(r)}${notes(r)}</td>
      <td class="act" onclick="event.stopPropagation()"><div class="acts">${actions(r)}</div></td></tr>`; };
  const coll = S.boardCollapsed || {};
  const table = () => BOARD_COLS.map(c => { const rs = colRoutes(c), shut = !!coll[c]; return `<div class="bsec ${shut || !rs.length ? 'shut' : ''} ${rs.length ? '' : 'empty'}">
      <button class="bsec-h" onclick="toggleBoardSection('${c}')" aria-expanded="${!shut}"><span class="chev">${shut || !rs.length ? '▸' : '▾'}</span><span class="pill ${c.toLowerCase()}">${c}</span><span class="n">${rs.length} route${rs.length === 1 ? '' : 's'}</span>${c === 'Unassigned' || c === 'Offered' ? (rs.filter(isRescue).length ? `<span class="pill rescue">${rs.filter(isRescue).length} rescue</span>` : '') : c === 'Accepted' && rs.some(r => r.status === 'Needs attention') ? `<span class="small" style="color:var(--warn)">${rs.filter(r => r.status === 'Needs attention').length} waiting on you</span>` : ''}</button>
      ${shut || !rs.length ? '' : `<div class="tbl-wrap"><table class="btable"><colgroup><col style="width:92px"><col style="width:104px"><col style="width:90px"><col style="width:104px"><col style="width:76px"><col style="width:150px"><col><col style="width:150px"></colgroup><thead><tr><th>Route</th><th>Hub</th><th>Start</th><th>Stops</th><th class="num">Pay</th><th>Driver</th><th>Status</th><th></th></tr></thead><tbody>${rs.map(row).join('')}</tbody></table></div>`}</div>`; }).join('');

  const autoable = suggest ? all.filter(r => r.status === 'Unassigned' && r.laneId && laneSuggestion(r).pick) : [];
  return guide() + `<div class="page-head"><div><h1>Dispatch board</h1><p>${fmtDate(now)}. Routes are built in Onfleet and arrive with the CSV upload.</p></div>
    <div class="row"><select id="areaFilter" onchange="S.areaFilter=this.value;render()"><option value="all" ${S.areaFilter === 'all' ? 'selected' : ''}>All areas</option>${S.areas.map(a => `<option value="${a.id}" ${S.areaFilter === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}</select>${autoable.length ? `<button class="btn" title="Offer each recognized route to its last driver" onclick="runAutoOffer(${JSON.stringify(autoable.map(r => r.id)).replace(/"/g, "'")})">↻ Offer ${autoable.length} to last drivers</button>` : ''}${S.routes.some(r => r.example) ? `<button class="btn" title="Take EX-01 to EX-13 and their example drivers off the board" onclick="removeExamples()">Remove examples</button>` : `<button class="btn" title="Adds 13 routes, one per offer and confirm state, timed from now" onclick="loadExamples()">Load example routes</button>`}<button class="btn" onclick="go('upload')">Upload CSV</button></div></div>
    <div class="tabs">${tabs.map(([n, i]) => `<button class="${S.boardTab === i ? 'active' : ''}" onclick="S.boardTab=${i};render()">${n}<span class="n">${tabCount(i)}</span></button>`).join('')}</div>
    <div class="board-bar"><div class="row">${rescue.length ? `<span class="chip" style="border-color:var(--crit);color:var(--crit)">Rescue <b>${rescue.length}</b></span>` : ''}${view === 'table' && all.length ? `<button class="btn sm ghost" onclick="S.boardCollapsed=Object.fromEntries(BOARD_COLS.map(c=>[c,!BOARD_COLS.every(k=>(S.boardCollapsed||{})[k])]));render()">${BOARD_COLS.every(k => coll[k]) ? 'Expand all' : 'Collapse all'}</button>` : ''}</div>
      <div class="seg" role="group" aria-label="Board view"><button class="${view === 'kanban' ? 'on' : ''}" onclick="setBoardView('kanban')">▥ Tiles</button><button class="${view === 'table' ? 'on' : ''}" onclick="setBoardView('table')">☰ Table</button></div></div>
    ${all.length ? (view === 'table' ? table() : kanban()) : `<p class="muted">No routes for this day yet. Upload an Onfleet file to add them${S.routes.length ? '' : ', or <a href="#" onclick="loadExamples();return false">load example routes</a> to see every offer and confirm state'}.</p>`}
    ${cancelled.length ? `<p class="small muted" style="margin-top:14px">Cancelled: ${cancelled.map(r => `<a href="#" onclick="go('route',{id:'${r.id}'});return false">${r.name}</a>`).join(', ')}</p>` : ''}`;
}

function vRoute() {
  const r = route(S.params.id); if (!r) return '<p>Route not found.</p>';
  const a = area(r.area), d = driver(r.driverId), o = r.offerId && offer(r.offerId);
  const hist = S.offers.filter(x => x.routeId === r.id).sort((x, y) => (y.sentAt || 0) - (x.sentAt || 0));
  const msgs = S.messages.filter(m => m.routeId === r.id).sort((x, y) => x.time - y.time);
  const hb = hoursToStart(r);
  const actions = [];
  if (r.status === 'Unassigned') { actions.push(`<button class="btn primary" onclick="openPicker('${r.id}','sms')">Offer</button>`, `<button class="btn" onclick="openPicker('${r.id}','phone')">Assign by phone</button>`, `<button class="btn ghost" onclick="route('${r.id}').status='Cancelled';render()">Client cancelled</button>`); }
  if (r.status === 'Offered') actions.push(`<button class="btn" onclick="withdraw(route('${r.id}'))">Withdraw offer</button>`);
  if (['Accepted', 'Needs attention'].includes(r.status)) actions.push(`<button class="btn danger" onclick="openRelease('${r.id}')">Release driver</button>`);
  if (r.status === 'Needs attention' && o && o.pending) actions.push(`<button class="btn primary" onclick="confirmedByPhone(route('${r.id}'))">Confirmed by phone</button>`);
  if (r.status === 'Needs attention' && r.attention === 'Order changed after acceptance') actions.push(`<button class="btn primary" onclick="retext(route('${r.id}'))">Re-text driver</button>`, `<button class="btn" onclick="clearAttention(route('${r.id}'))">Keep as is</button>`);
  if (r.status === 'Needs attention' && r.attention === 'Driver deactivated in Airtable') actions.push(`<button class="btn" onclick="openRelease('${r.id}','Dispatcher')">Reassign</button>`);
  if (r.status === 'Unassigned' && r.onfleetDriverId && !eligibility(driver(r.onfleetDriverId), r).length) actions.unshift(`<button class="btn primary" onclick="confirmOnfleet(route('${r.id}'),driver('${r.onfleetDriverId}'),false)">Confirm with ${shortName(driver(r.onfleetDriverId))}</button>`);
  if (canAdjust(r)) actions.push(`<button class="btn" onclick="openAdj('${r.id}')">Adjust route</button>`);
  if (r.attention === 'Order not in latest file' && r.status !== 'Needs attention') actions.push(`<button class="btn" onclick="route('${r.id}').attention=null;render()">Keep order</button>`);
  const sim = ['Accepted'].includes(r.status) && o && !o.pending ? `<div class="panel"><h3>Confirmation checks</h3><p class="small muted" style="margin:0 0 8px">Scheduled by the job runner in the hub's time zone: heads-up ${48}h before, reconfirm ${S.settings.reconfirmHours}h before, final ${S.settings.finalHours}h before. Fire one now for the demo.</p><div class="row">
    <button class="btn sm" onclick="sendHeadsUp(route('${r.id}'))">Send heads-up</button><button class="btn sm" onclick="sendCheck(route('${r.id}'),'reconfirm')">Send reconfirm</button><button class="btn sm" onclick="sendCheck(route('${r.id}'),'final')">Send final confirm</button></div></div>` : '';
  const pendingBox = o && o.pending && r.status !== 'Needs attention' ? `<div class="notice info"><div>Waiting on ${d.name}'s ${o.pending === 'reconfirm' ? 'reconfirm' : o.pending === 'final' ? 'final confirm' : 'reply to the change'}. <button class="btn sm" style="margin-left:8px" onclick="silentOnCheck(route('${r.id}'))">Simulate ${o.pending === 'reconfirm' ? S.settings.reconfirmWindow : S.settings.finalWindow} min of silence</button></div></div>` : '';
  const ciPanel = dayOffset(r) === 0 && (d || r.noShow) ? `<div class="panel"><h3>Site check-in</h3>${r.noShow ? `<p class="small" style="margin:0 0 8px;color:var(--crit)">${driver(r.noShow.driverId).name} marked no-show at ${fmtTime(r.noShow.at)} by ${r.noShow.by}.</p>` : ''}${d ? `<div class="row">${ciTag(r)}${(!r.checkin || r.checkin.status === 'Late') ? `<button class="btn sm" onclick="checkIn('${r.id}','Arrived')">Arrived</button>${r.checkin ? '' : `<button class="btn sm" onclick="checkIn('${r.id}','Late')">Late</button>`}<button class="btn sm danger" onclick="checkIn('${r.id}','No-show')">No-show</button>` : ''}</div>` : '<p class="small muted" style="margin:0">Rescue open. No driver yet.</p>'}</div>` : '';
  return `<button class="btn ghost sm" onclick="go('board')">← Board</button>
  <div class="page-head" style="margin-top:8px"><div><h1>${r.name} ${statusPill(r)}</h1><p>${fmtDate(routeDate(r))} · ${hhmm(r.start)} · ${a.name} / ${a.hub} · ${r.vehicle}${hb > 0 && hb < 48 ? ` · starts in ${dur(routeStart(r) - now.getTime())}` : ''}${r.laneId ? ` · <a style="cursor:pointer" onclick="go('lane',{id:'${r.laneId}'})">↻ ${esc(lane(r.laneId).name)}</a>` : ''}</p></div><div class="row">${actions.join('')}</div></div>
  ${r.attention ? `<div class="notice warn" style="margin-bottom:12px"><div><b>Needs a decision:</b> ${r.attention}.${r.attention === 'Driver deactivated in Airtable' ? ' Driver stays attached until you act; the picker will not offer them new work.' : ''}</div></div>` : ''}
  ${pendingBox}
  <div class="two" style="margin-top:12px">
    <div class="stack">
      <div class="panel"><h3>Driver</h3>${d ? `<div class="row" style="margin-bottom:8px">${driverLine(r)}<span class="mono small muted">${phoneFmt(d.phone)}</span></div>
` : `<p class="muted small" style="margin:0">No driver. ${r.status === 'Unassigned' ? 'Offer the route or assign by phone.' : ''}</p>`}
        ${r.fromOnfleet ? `<div class="small" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">Onfleet driver: <b>${r.onfleetWorker ? esc(r.onfleetWorker) : 'none'}</b>${r.onfleetWorker && !r.onfleetDriverId ? ' (not in Airtable)' : ''} <span class="muted">from ${r.importId}, ${fmtDT(r.onfleetAt)}</span></div>` : ''}${d && ['Accepted', 'Needs attention', 'Completed'].includes(r.status) ? `<label class="row small" style="margin-top:8px"><input type="checkbox" ${r.onfleet ? 'checked' : ''} onchange="route('${r.id}').onfleet=this.checked;render()"> Assigned to ${shortName(d)} in Onfleet</label>` : ''}
        ${r.status === 'Offered' && o ? `<p class="small" style="margin:8px 0 0">Open offer, <span class="countdown" data-countdown="${o.id}">${Math.ceil((o.expiresAt - now.getTime()) / 60000)} min left</span>. The driver replies on the phone panel.</p>` : ''}</div>
      ${ciPanel}
      ${sim}
      <div class="panel"><h3>Orders <span class="muted small">${activeStops(r)} active${adjStops(r) ? `, ${adjStops(r) > 0 ? '+' : ''}${adjStops(r)} by adjustment` : ''}</span></h3><div class="tbl"><table><thead><tr><th>Order</th><th>Address</th><th>Customer</th><th class="r">Pkgs</th><th></th></tr></thead><tbody>
        ${r.orders.slice().sort((p, q) => (p.seq || 0) - (q.seq || 0)).map(x => `<tr${x.status === 'cancelled' ? ' style="opacity:.5"' : ''}><td class="mono">${x.id}</td><td>${esc(x.addr)}${x.type === 'b2b' ? ' <span class="pill completed">B2B</span>' : ''}</td><td>${esc(x.name)}</td><td class="r num">${x.pkgs}</td><td class="small">${x.status === 'cancelled' ? '<span class="pill cancelled">Cancelled</span>' : ''}${!x.inLatest && x.status === 'active' ? '<span class="pill attention">Not in latest file</span>' : ''}${x.history.length ? `<span class="muted" title="${esc(x.history.map(h => `${h.field}: ${h.old} → ${h.new} (${h.batch})`).join('\n'))}">changed ×${x.history.length}</span>` : ''}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel"><h3>Message thread</h3>${msgs.length ? `<div class="thread">${msgs.map(m => `<div class="msg ${m.dir} ${m.status === 'failed' ? 'failed' : ''}">${esc(m.body)}<span class="mt">${fmtDT(m.time)} · ${m.dir === 'out' ? (m.status === 'failed' ? 'Failed: ' + m.error : 'Delivered') : 'From ' + (driver(m.driverId)?.name || m.phone)} · ${m.sid}</span></div>`).join('')}</div>` : '<p class="muted small" style="margin:0">No texts yet on this route.</p>'}</div>
    </div>
    <div class="stack">
      ${adjPanel(r)}
      ${lanePanel(r)}
      <div class="panel"><h3>Pay <span class="muted small">${market(a.market).name} pricing</span></h3>${(() => { const pr = price(r), lk = r.lockedPay != null && Math.abs(r.lockedPay - pr.pay) > 0.004; return `<div class="pay">${pr.lines.map(l => `<span class="small">${l[0]}</span><span class="num small">${l[1] < 0 ? '−' + money(-l[1]) : money(l[1])}</span>`).join('')}${lk ? `<span class="small">Locked at offer (current parameters say ${money(pr.pay)})</span><span class="num small">${money(r.lockedPay - pr.pay)}</span>` : ''}</div>${pr.hours ? `<p class="small muted" style="margin:6px 0 8px">About ${Math.round(pr.miles)} road miles, first stop ${Math.round(pr.first)} mi from the hub, ${pr.hours.toFixed(1)} h, ${money(payout(r) / pr.hours)}/hr${canSeePricing() ? `. Client revenue ${money(pr.revenue)}, margin ${pct((pr.revenue - payout(r)) / pr.revenue)} (target ${pr.m.p.targetMargin}%)` : ''}. ${r.window ? 'Delivery window ' + r.window.replace('-', ' to ') + '.' : ''}</p>` : canSeePricing() ? `<p class="small muted" style="margin:6px 0 8px">Client revenue ${money(pr.revenue)}, margin ${pct((pr.revenue - payout(r)) / pr.revenue)}. No coordinates in this file, so no miles or hours.</p>` : ''}`; })()}<div class="pay"><span>Driver pay${r.lockedPay != null ? ' (texted to driver)' : ''}</span><span class="num">${money(payout(r))}</span><span>Route fee (greater of ${money(S.settings.feeMin)} or ${S.settings.feePct}%)</span><span class="num">−${money(fee(r))}</span><span>Adjustments</span><span class="num">${money(adjTotal(r))}</span><span class="tot">Net payout</span><span class="tot num">${money(net(r))}</span></div>
        ${r.approved ? `<p class="small muted" style="margin:8px 0 0">Locked. Signed off ready to pay by ${r.approved.by}, ${fmtDT(r.approved.at)}.</p>` : `<p class="small muted" style="margin:8px 0 0">${r.lockedPay != null ? 'Locked at the amount texted to the driver. Changes made in Onfleet afterward go in as adjustments.' : 'Follows the market parameters until an offer goes out.'}</p>`}</div>
      <div class="panel"><h3>Pickup</h3><dl class="kv"><dt>Hub</dt><dd>${a.hub}</dd><dt>Address</dt><dd>${a.address}</dd><dt>Time</dt><dd class="mono">${hhmm(r.start)}</dd><dt>Instructions</dt><dd>${a.instr}</dd></dl></div>
      <div class="panel"><h3>Offer history <span class="muted small">ledger</span></h3>${hist.length ? hist.map(x => { const dd = driver(x.driverId); const evs = S.events.filter(e => e.offerId === x.id).sort((p, q) => p.time - q.time); return `<div style="margin-bottom:12px"><div class="row" style="margin-bottom:4px"><span class="avatar">${initials(dd.name)}</span><b>${dd.name}</b><span class="mono small muted">${x.id} · ${x.channel}</span>${x.outcome ? `<span class="pill ${x.outcome === 'Completed' ? 'accepted' : ['Late bail', 'No-show'].includes(x.outcome) ? 'rescue' : 'unassigned'}">${x.outcome}</span>` : x.open ? '<span class="pill offered">Open</span>' : '<span class="pill accepted">Active</span>'}${x.rescueCover ? '<span class="pill completed">Rescue cover</span>' : ''}</div><ul class="timeline">${evs.map(e => `<li><span class="t">${fmtTime(e.time)}</span><span><b>${e.type}</b> <span class="muted">${e.actor}${e.details ? ' · ' + e.details : ''}</span></span></li>`).join('')}</ul></div>`; }).join('') : '<p class="muted small" style="margin:0">No offers yet.</p>'}</div>
    </div></div>`;
}

function lanePanel(r) {
  const l = lane(r.laneId), m = r.laneMatch;
  if (!l) return `<div class="panel"><h3>Route history</h3><p class="small muted" style="margin:0 0 8px">No lane matched. ${m && m.pct > 0 ? `Closest is ${esc(lane(m.laneId).name)} at ${Math.round(m.pct * 100)}% (${m.seen} of ${m.total} stops), under the ${S.settings.laneThreshold}% threshold.` : 'None of these stops appear on a known lane.'} It starts a lane of its own once it completes.</p>
    <div class="row"><select id="linkLane">${S.lanes.filter(x => x.area === r.area).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn sm" onclick="route('${r.id}').laneId=document.getElementById('linkLane').value;route('${r.id}').laneManual=true;render();toast('Linked. Future matches will learn from this run.')">Link to a lane anyway</button></div></div>`;
  const s = laneSuggestion(r), pct = laneMatchPct(r);
  const skipped = s.cands.filter(c => c !== s.pick && c.blocked.length);
  const off = S.settings.laneAuto === 'off';
  return `<div class="panel lane-panel"><h3><span class="lane"><span class="ico">↻</span></span> ${esc(l.name)}</h3>
  <p class="small muted" style="margin:0 0 8px">${r.history ? 'A past run on this lane.' : pct !== null ? `${pct}% match: ${m.seen} of ${m.total} stops were on this lane's last ${Math.min(S.settings.laneWindow, s.runs.length)} runs.` : 'Linked by a dispatcher.'} ${s.regular ? `Regular driver ${s.regular.d.name}, ${s.regular.n} of the last ${s.regular.of}.` : ''} <a style="cursor:pointer" onclick="go('lane',{id:'${l.id}'})">Full history</a></p>
  ${off ? '<p class="small muted" style="margin:0">Driver suggestions are off (Settings › Lanes).</p>' : s.pick ? `<div class="notice ok"><div><b>${s.pick.d.name}</b> ${s.pick.why}, ${s.pick.n} of the last ${s.runs.length} runs. ${lblHtml(s.pick.d)}

function saveAdj(rid) {
