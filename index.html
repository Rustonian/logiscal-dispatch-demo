<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logiscal Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ops console. Fixed top bar, left nav, working board in the middle, a simulated driver phone docked right. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --fg:#18222c; --muted:#5f6c79; --line:#d5dce4; --line-strong:#b9c3cd;
  --accent:#0d5c78; --accent-fg:#ffffff; --accent-soft:#dcedf3;
  --ok:#1d7a4c; --ok-bg:#dff3e7; --warn:#a85f00; --warn-bg:#fdecd2; --crit:#b4352b; --crit-bg:#fbe1de; --info:#2a5db0; --info-bg:#dfe8f8;
  --phone-bg:#0f1316; --phone-fg:#eef2f5; --bubble-out:#1d6f8a; --bubble-in:#2a323a;
  --display:"Barlow","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#171d23; --surface-2:#1d242b; --fg:#e4eaf0; --muted:#95a3b1; --line:#2a333c; --line-strong:#3b4650;
  --accent:#4fb0cf; --accent-fg:#071219; --accent-soft:#163340;
  --ok:#5ccb8c; --ok-bg:#13301f; --warn:#f0b454; --warn-bg:#3a2a0c; --crit:#f08a80; --crit-bg:#3d1a17; --info:#8fb2f0; --info-bg:#1a2a45;
  --phone-bg:#05080a; --phone-fg:#eef2f5; --bubble-out:#1d6f8a; --bubble-in:#262e36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#171d23; --surface-2:#1d242b; --fg:#e4eaf0; --muted:#95a3b1; --line:#2a333c; --line-strong:#3b4650;
  --accent:#4fb0cf; --accent-fg:#071219; --accent-soft:#163340;
  --ok:#5ccb8c; --ok-bg:#13301f; --warn:#f0b454; --warn-bg:#3a2a0c; --crit:#f08a80; --crit-bg:#3d1a17; --info:#8fb2f0; --info-bg:#1a2a45;
  --phone-bg:#05080a; --phone-fg:#eef2f5; --bubble-out:#1d6f8a; --bubble-in:#262e36;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:22px;font-weight:700}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
a{color:var(--accent)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);padding:6px 8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:200px 1fr 330px;grid-template-rows:52px 1fr;height:100%;min-height:0}
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .name{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.01em}
.brand .client{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:8px}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-left:auto}
.clock .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.role{display:flex;align-items:center;gap:6px;font-size:12px}
.side{background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
.side button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--fg)}
.side button:hover{background:var(--surface-2)}
.side button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .count{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .count.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.side .count.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.side .group{padding:14px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
main{overflow:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.phone-dock{background:var(--phone-bg);color:var(--phone-fg);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);padding:6px 11px;cursor:pointer;font-weight:500;font-size:13px;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs .n{font-family:var(--mono);font-size:11px;background:var(--surface-2);border-radius:10px;padding:0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.chip b{font-family:var(--mono);font-weight:500}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.unassigned{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.offered{background:var(--info-bg);color:var(--info)}
.pill.accepted{background:var(--ok-bg);color:var(--ok)}
.pill.attention{background:var(--warn-bg);color:var(--warn)}
.pill.completed{background:var(--accent-soft);color:var(--accent)}
.pill.cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.pill.rescue{background:var(--crit);color:#fff}
.lbl{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
.lbl.Reliable{background:var(--ok-bg);color:var(--ok)}
.lbl.Solid{background:var(--info-bg);color:var(--info)}
.lbl.Watch{background:var(--warn-bg);color:var(--warn)}
.lbl.New,.lbl.Noroutes{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.lbl.Opted{background:var(--crit-bg);color:var(--crit)}
.lbl.Inactive{background:var(--crit-bg);color:var(--crit)}
.lbl.Hold{background:var(--crit-bg);color:var(--crit)}
.ci{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px}
.ci.Arrived{background:var(--ok-bg);color:var(--ok)}.ci.Late{background:var(--warn-bg);color:var(--warn)}.ci.Noshow{background:var(--crit);color:#fff}.ci.Waiting{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.checkin-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.checkin-row:first-child{border-top:0}
.checkin-btns{display:flex;gap:6px;flex-wrap:wrap}
.health td.st{white-space:nowrap}

.group-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px}
.group-title .n{font-family:var(--mono);color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card.rescue{border-left:4px solid var(--crit)}
.card.attention{border-left:4px solid var(--warn)}
.card .title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .rn{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.01em}
.card .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.card .meta b{color:var(--fg);font-weight:500;font-family:var(--mono)}
.card .driver{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;flex:none}
.card .actions{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.countdown{font-family:var(--mono);font-size:12px;color:var(--info)}
.countdown.low{color:var(--crit)}
.pickup-in{font-family:var(--mono);font-size:12px;color:var(--crit);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;min-width:0}
.panel h3{margin-bottom:8px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pay{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:13px}
.pay .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12px}
.timeline li{display:grid;grid-template-columns:62px 1fr;gap:10px}
.timeline .t{font-family:var(--mono);color:var(--muted)}
.notice{border-radius:var(--radius);padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.crit{background:var(--crit-bg);color:var(--crit)}
.notice.info{background:var(--info-bg);color:var(--info)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.thread{display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;padding:7px 10px;border-radius:12px;font-size:13px;line-height:1.35}
.msg.out{align-self:flex-start;background:var(--accent-soft);color:var(--fg);border-bottom-left-radius:3px}
.msg.in{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);border-bottom-right-radius:3px}
.msg .mt{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:3px}
.msg.failed{border:1px dashed var(--crit)}

/* phone */
.phone-head{padding:12px 14px;border-bottom:1px solid #222a31;display:flex;flex-direction:column;gap:6px}
.phone-head .eyebrow{color:#8d9aa7}
.phone-head select{background:#1a2127;color:var(--phone-fg);border-color:#2d363e;width:100%}
.phone-thread{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.phone-thread .bubble{max-width:86%;padding:8px 11px;border-radius:16px;font-size:13px;line-height:1.35}
.phone-thread .bubble.out{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px}
.phone-thread .bubble.in{align-self:flex-end;background:var(--bubble-out);color:#fff;border-bottom-right-radius:4px}
.phone-thread .bubble .mt{display:block;font-family:var(--mono);font-size:10px;opacity:.6;margin-top:3px}
.phone-thread .sys{align-self:center;font-size:11px;color:#8d9aa7;text-align:center;padding:2px 8px}
.phone-reply{padding:10px 14px;border-top:1px solid #222a31;display:flex;flex-direction:column;gap:8px}
.phone-reply .quick{display:flex;gap:6px;flex-wrap:wrap}
.phone-reply .quick button{background:#1a2127;color:var(--phone-fg);border:1px solid #2d363e;border-radius:14px;padding:5px 11px;cursor:pointer;font-size:12px}
.phone-reply .quick button:hover{background:#242d35}
.phone-reply .quick button.yes{background:#1d6f8a;border-color:transparent}
.phone-reply form{display:flex;gap:6px}
.phone-reply input{flex:1;background:#1a2127;color:var(--phone-fg);border-color:#2d363e;border-radius:16px;padding:7px 12px;min-width:0}
.phone-reply .send{background:#1d6f8a;color:#fff;border:0;border-radius:16px;padding:7px 12px;cursor:pointer}
.phone-reply .hint{font-size:11px;color:#8d9aa7}

/* upload */
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);background:var(--surface)}
.drop .files{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.cnt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.cnt .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.cnt .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.cnt.new .v{color:var(--ok)}.cnt.changed .v{color:var(--info)}.cnt.missing .v{color:var(--warn)}.cnt.rejected .v{color:var(--crit)}
.diff{font-family:var(--mono);font-size:12px}
.diff .old{text-decoration:line-through;color:var(--muted)}
.diff .new{color:var(--info)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:8px;box-shadow:var(--shadow);width:min(760px,100%);max-height:90vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.picker tr.ineligible td{opacity:.5}
.score{font-family:var(--mono);font-weight:500}
.bar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:30}
.toast{background:var(--fg);color:var(--bg);padding:9px 13px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow);max-width:320px}
.guide{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;font-size:13px}
.guide ol{margin:4px 0 0;padding-left:18px}
.guide li{margin:2px 0}
.guide .x{margin-left:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label input,.form label select,.form label textarea{color:var(--fg)}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:12px}
.step b{display:block;font-family:var(--display);font-size:14px}
.step.done{border-color:var(--ok);background:var(--ok-bg)}
.lane{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lane .ico{display:inline-flex;width:16px;height:16px;border-radius:50%;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.lane a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.lane a:hover{text-decoration:underline}
.lane-panel{border-left:3px solid var(--accent)}
.lane-panel h3{display:flex;align-items:center;gap:6px}
.share{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.share i{display:block;height:100%}
.menu-btn{display:none}

@media (max-width:1100px){
  .app{grid-template-columns:180px 1fr}
  .phone-dock{position:fixed;right:0;top:0;bottom:0;width:min(340px,100%);z-index:15;transform:translateX(100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .phone-dock.open{transform:none}
  .menu-btn{display:inline-flex}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  .side{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:2px}
  .side .group{display:none}
  .side button{width:auto;white-space:nowrap}
  .two{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  .top .client,.top .clock .sync{display:none}
}
@media (prefers-reduced-motion:reduce){.phone-dock{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="name">Logiscal Dispatch</span><span class="client">Client: Logiscal · Austin</span></div>
    <div class="clock"><span class="dot" title="Airtable sync healthy"></span><span id="clock"></span><span class="sync">· Airtable synced <span id="synced">4 min ago</span></span></div>
    <div class="role"><span class="muted">Signed in as</span>
      <select id="role" aria-label="Switch role">
        <option value="dispatcher">Dana Ruiz · Dispatcher</option>
        <option value="admin">Mike Patel · Client admin</option>
        <option value="ops">Ruston · Gigee ops</option>
      </select>
    </div>
    <button class="btn sm menu-btn" id="phoneToggle">Driver phone</button>
  </header>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
  <aside class="phone-dock" id="phone"></aside>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

<script>
/* ---------------- Seed data ---------------- */
const DAY = 86400000;
const START_NOW = new Date(2026, 9, 16, 14, 40);
let now = new Date(START_NOW);

function dayOffset(r) { return Math.round((routeDate(r) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / DAY); }
function phoneFmt(p) { return p ? `(${p.slice(2, 5)}) ${p.slice(5, 8)}-${p.slice(8)}` : ''; }
function initials(n) { return n.split(' ').map(x => x[0]).join('').slice(0, 2); }
function activeStops(r) { return r.orders.filter(o => o.status === 'active').length; }
function stopRange(n) { const w = Math.max(1, S.settings.stopRange); const lo = Math.max(1, Math.floor(n / w) * w); return `${lo} to ${lo + w}`; }
function payout(r) { return activeStops(r) * area(r.area).ppd; }
function fee(r) { return Math.max(S.settings.feeMin, payout(r) * S.settings.feePct / 100); }
function adjTotal(r) { return S.adjustments.filter(a => a.routeId === r.id).reduce((s, a) => s + a.amount, 0); }
function net(r) { return payout(r) - fee(r) + adjTotal(r); }
function hoursToStart(r) { return (routeStart(r) - now.getTime()) / 3600000; }
function dur(ms) { const m = Math.max(0, Math.round(ms / 60000)); const h = Math.floor(m / 60); return h ? `${h}h ${String(m % 60).padStart(2, '0')}m` : `${m}m`; }
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3200); }
function fill(tpl, r, d) { const a = area(r.area); const ctx = { date: fmtDate(routeDate(r)), start_time: hhmm(r.start), hub: a.hub, stops: activeStops(r), stop_range: stopRange(activeStops(r)), payout: payout(r).toFixed(2), expiry: S.settings.expiry, route_name: r.name, pickup_address: a.address, instructions: a.instr, support_contact: S.settings.support, driver_first: d ? d.name.split(' ')[0] : '' }; return tpl.replace(/\{(\w+)\}/g, (_, k) => ctx[k] ?? ''); }

/* ---------------- Reliability ---------------- */
function stats(d) {
  const b = Object.assign({}, d.base); let last = d.last;
  const demo = S.offers.filter(o => o.driverId === d.id && o.sentAt && o.sentAt >= START_NOW.getTime() - 60000 && !o.seed);
  // Demo offers: anything created after the page opened counts live; seeded rows are already in base.
  for (const o of S.offers.filter(o => o.driverId === d.id && o.live)) {
    b.offers++; if (o.reply) b.answered++; if (o.acceptedAt) b.accepted++;
    if (['Completed', 'Incomplete', 'No-show', 'Late bail', 'Early release'].includes(o.outcome)) b.committed++;
    if (o.outcome === 'Completed') { b.completed++; if (o.rescueCover) b.rescues++; last = Math.max(last || 0, routeStart(route(o.routeId))); }
    if (o.outcome === 'Late bail') b.late++; if (o.outcome === 'Early release') b.early++; if (o.outcome === 'No-show') b.noshow++;
    if (o.reconfirmSentAt) { b.confSent++; if (o.reconfirmedAt) b.confOnTime++; } if (o.finalSentAt) { b.confSent++; if (o.finalConfirmedAt) b.confOnTime++; }
  }
  const resp = b.offers ? b.answered / b.offers : 0, acc = b.offers ? b.accepted / b.offers : 0, comp = b.committed ? b.completed / b.committed : 0, conf = b.confSent ? b.confOnTime / b.confSent : 0;
  const w = S.settings.weights;
  const score = Math.round(comp * w.completion + acc * w.acceptance + conf * w.confirm + Math.min(b.completed * w.perRoute, w.perRouteMax) + Math.min(b.rescues * w.perRescue, w.perRescueMax) + b.early * w.early + b.late * w.late + b.noshow * w.noshow + (d.tier === 'A' ? w.tierA : d.tier === 'B' ? w.tierB : 0));
  let label = b.offers < 5 ? 'New' : b.committed === 0 ? 'No routes yet' : (b.noshow >= 2 || b.late >= 3 || comp < .85) ? 'Watch' : comp < .95 ? 'Solid' : 'Reliable';
  const days = last ? Math.floor((now.getTime() - last) / DAY) : null;
  return Object.assign(b, { respMin: b.resp, resp, acc, comp, conf, score, label, days });
}
const lblClass = l => l.replace(/\s.*/, '');
function lblHtml(d) { const s = stats(d); if (!d.active) return `<span class="lbl Inactive">Inactive</span>`; if (d.optOut) return `<span class="lbl Opted">Opted out</span>`; if (onHold(d)) return `<span class="lbl Hold" title="${esc(onHold(d).reason)}">On hold</span>`; return `<span class="lbl ${lblClass(s.label)}">${s.label}</span>`; }

/* ---------------- Eligibility & actions ---------------- */
function bookedOn(d, date, exceptId) { return S.routes.some(r => r.id !== exceptId && r.driverId === d.id && r.date === date && ['Accepted', 'Needs attention', 'Offered'].includes(r.status)); }
function hasOpenOffer(d, exceptId) { return S.offers.some(o => o.driverId === d.id && o.open && o.routeId !== exceptId); }
function eligibility(d, r) {
  const why = [];
  if (!d.active) why.push('Inactive in Airtable'); if (d.optOut) why.push('Texted STOP'); if (onHold(d)) why.push('On hold'); if (d.area !== r.area) why.push('Other area');
  if (bookedOn(d, r.date, r.id)) why.push('Booked ' + fmtDate(routeDate(r))); if (hasOpenOffer(d, r.id)) why.push('Has an open offer');
  const prior = S.offers.filter(o => o.routeId === r.id && o.driverId === d.id && o.outcome);
  if (prior.some(o => ['Late bail', 'Early release', 'No-show'].includes(o.outcome))) why.push('Bailed on this route');
  else if (prior.some(o => ['Declined', 'Expired'].includes(o.outcome))) why.push('Passed on this route');
  return why;
}
function sendSms(d, body, r, o, opts = {}) { return mkMsg(Object.assign({ dir: 'out', driverId: d.id, body, routeId: r ? r.id : null, offerId: o ? o.id : null }, opts)); }

function offerRoute(r, d, channel, opts = {}) {
  const o = mkOffer({ routeId: r.id, driverId: d.id, sentAt: now.getTime(), live: true, channel: channel === 'phone' ? 'Phone' : 'SMS', auto: !!opts.auto });
  r.offerId = o.id; r.driverId = d.id;
  const actor = opts.actor || (opts.auto ? 'System (lane rule)' : actorName());
  if (channel === 'phone') {
    o.respondedAt = o.acceptedAt = now.getTime(); o.reply = 'Yes'; if (r.rescue) o.rescueCover = true;
    r.status = 'Accepted'; ev(o.id, 'Assigned by phone', actor, 'Accepted offer recorded, no offer text');
    sendSms(d, fill(S.settings.templates.accepted, r, d), r, o); if (!opts.silent) toast(`${d.name} assigned to ${r.name} by phone. Confirmation text sent.`);
  } else {
    o.open = true; o.expiresAt = now.getTime() + S.settings.expiry * 60000; r.status = 'Offered';
    ev(o.id, 'Offer sent', actor, opts.detail ? opts.detail : opts.auto ? `Auto-offer: last driver on ${lane(r.laneId).name}` : (r.laneId ? `SMS, suggested from ${lane(r.laneId).name}` : 'SMS')); sendSms(d, fill(S.settings.templates.offer, r, d), r, o); if (!opts.silent) toast(`Offer texted to ${d.name}. Expires in ${S.settings.expiry} min.`);
  }
  if (!opts.silent) { S.phoneDriver = d.id; closeModal(); render(); }
}
function withdraw(r) { const o = offer(r.offerId); o.open = false; o.outcome = 'Withdrawn'; ev(o.id, 'Withdrawn', actorName(), 'Does not count against driver'); r.status = 'Unassigned'; r.driverId = null; r.offerId = null; sendSms(driver(o.driverId), fill(S.settings.templates.expired, r), r, o); toast('Offer withdrawn.'); render(); }
function expireOffer(o) { const r = route(o.routeId); o.open = false; o.outcome = 'Expired'; ev(o.id, 'Expired', 'System', `No reply in ${S.settings.expiry} min`); r.status = 'Unassigned'; r.driverId = null; r.offerId = null; sendSms(driver(o.driverId), fill(S.settings.templates.expired, r), r, o); toast(`${r.name}: offer to ${driver(o.driverId).name} expired. Back to Unassigned.`); }
function acceptOffer(o) { const r = route(o.routeId), d = driver(o.driverId); o.open = false; o.respondedAt = o.acceptedAt = now.getTime(); o.reply = 'Yes'; if (r.rescue) o.rescueCover = true; r.status = 'Accepted'; r.attention = null; ev(o.id, 'Reply YES', 'Driver', ''); ev(o.id, 'Accepted', 'System', 'Route locked'); sendSms(d, fill(S.settings.templates.accepted, r, d), r, o); toast(`${d.name} accepted ${r.name}.`); }
function declineOffer(o) { const r = route(o.routeId), d = driver(o.driverId); o.open = false; o.respondedAt = now.getTime(); o.reply = 'No'; o.outcome = 'Declined'; ev(o.id, 'Reply NO', 'Driver', ''); r.status = 'Unassigned'; r.driverId = null; r.offerId = null; sendSms(d, fill(S.settings.templates.declined, r, d), r, o); toast(`${d.name} declined ${r.name}. Back to Unassigned.`); }
function release(r, by) {
  const o = offer(r.offerId), d = driver(o.driverId); const hb = hoursToStart(r); o.releasedAt = now.getTime(); o.releasedBy = by; o.hoursBefore = Math.round(hb * 10) / 10; o.pending = null;
  let outcome, next;
  if (by === 'Driver') { outcome = hb < 24 ? 'Late bail' : 'Early release'; next = 'Unassigned'; if (hb < 24) r.rescue = true; }
  else if (by === 'Dispatcher') { outcome = 'Dispatcher reassign'; next = 'Unassigned'; }
  else { outcome = 'Client cancel'; next = 'Cancelled'; }
  o.outcome = outcome; o.outcomeBy = 'System'; ev(o.id, 'Released', actorName(), `${by}-initiated, ${o.hoursBefore} h before start`); ev(o.id, 'Outcome set', 'System', outcome);
  r.status = next; r.driverId = null; r.offerId = null; r.attention = null; r.onfleet = false;
  if (outcome === 'Late bail') suggestHold(d, `Late bail on ${r.name}, ${o.hoursBefore} h before start`, r);
  if (next !== 'Cancelled') sendSms(d, fill(S.settings.templates.released, r, d), r, o);
  toast(`${d.name} released from ${r.name}: ${outcome}.${hb < 24 && by === 'Driver' ? ' Route flagged Rescue.' : ''}`); closeModal(); render();
}
function confirmedByPhone(r) { const o = offer(r.offerId); if (o.pending === 'reconfirm') o.reconfirmedAt = now.getTime(); else if (o.pending === 'final') o.finalConfirmedAt = now.getTime(); o.channel = 'Phone'; o.pending = null; ev(o.id, 'Confirmed by phone', actorName(), ''); r.status = 'Accepted'; r.attention = null; toast(`${r.name} confirmed by phone. Back to Accepted.`); render(); }
function sendCheck(r, kind) { const o = offer(r.offerId), d = driver(r.driverId); if (kind === 'reconfirm') o.reconfirmSentAt = now.getTime(); else o.finalSentAt = now.getTime(); o.pending = kind; ev(o.id, kind === 'reconfirm' ? 'Reconfirm sent' : 'Final confirm sent', 'System', ''); sendSms(d, fill(S.settings.templates[kind], r, d), r, o); S.phoneDriver = d.id; toast(`${kind === 'reconfirm' ? 'Reconfirm' : 'Final confirm'} texted to ${d.name}.`); render(); }
function sendHeadsUp(r) { const o = offer(r.offerId), d = driver(r.driverId); ev(o.id, 'Heads-up sent', 'System', ''); sendSms(d, fill(S.settings.templates.headsup, r, d), r, o); S.phoneDriver = d.id; toast(`Heads-up texted to ${d.name}.`); render(); }
function silentOnCheck(r) { const o = offer(r.offerId); ev(o.id, `No reply in ${o.pending === 'reconfirm' ? S.settings.reconfirmWindow : S.settings.finalWindow} min`, 'System', 'Route moved to Needs attention'); r.status = 'Needs attention'; r.attention = o.pending === 'reconfirm' ? 'Silent on reconfirm' : 'Silent on final confirm'; if (hoursToStart(r) < 24) r.rescue = true; toast(`${r.name}: driver silent. Moved to Needs attention.`); render(); }
function retext(r) { const d = driver(r.driverId), o = offer(r.offerId); sendSms(d, `Update to ${r.name} on ${fmtDate(routeDate(r))}: now about ${stopRange(activeStops(r))} stops, pays ${money(payout(r))}. Reply YES to keep it or NO to release.`, r, o); o.pending = 'change'; S.phoneDriver = d.id; ev(o.id, 'Change notice sent', actorName(), ''); toast(`${d.name} texted about the change.`); render(); }
function clearAttention(r) { r.status = 'Accepted'; r.attention = null; render(); }

/* ---------------- Performance holds ---------------- */
function onHold(d) { return d && S.holds.find(h => h.driverId === d.id); }
function suggestHold(d, reason, r) {
  if (!d || onHold(d)) return;
  const ex = S.holdSuggestions.find(x => x.driverId === d.id);
  if (ex) { ex.reason += `; ${reason}`; ex.at = now.getTime(); return; }
  S.holdSuggestions.push({ id: 'HS' + (S.holdSuggestions.length + 2), driverId: d.id, routeId: r ? r.id : null, reason, at: now.getTime() });
}
function putOnHold(did, reason, suggestionId) {
  const d = driver(did); if (!d || onHold(d)) return;
  reason = (reason || '').trim(); if (!reason) { toast('Add a reason so the team knows why.'); return; }
  S.holds.push({ driverId: did, reason, by: actorName(), at: now.getTime() });
  S.holdSuggestions = S.holdSuggestions.filter(x => x.driverId !== did);
  const up = S.routes.filter(r => r.driverId === did && routeStart(r) > now.getTime() && ['Offered', 'Accepted', 'Needs attention'].includes(r.status));
  up.forEach(r => { const o = offer(r.offerId); if (r.status === 'Offered') { o.open = false; o.outcome = 'Withdrawn'; ev(o.id, 'Withdrawn', actorName(), 'Driver put on hold'); r.status = 'Unassigned'; r.driverId = null; r.offerId = null; } else { r.status = 'Needs attention'; r.attention = 'Driver on hold'; ev(o.id, 'Driver put on hold', actorName(), reason); } });
  toast(`${d.name} is on hold. Skipped in every offer and suggestion until removed.${up.length ? ` ${up.length} upcoming route${up.length > 1 ? 's' : ''} moved to Needs attention.` : ''}`); render();
}
function removeHold(did) { S.holds = S.holds.filter(h => h.driverId !== did); toast(`${driver(did).name} is off hold and can be offered routes again.`); render(); }
function dismissSuggestion(id) { const x = S.holdSuggestions.find(h => h.id === id); S.holdSuggestions = S.holdSuggestions.filter(h => h.id !== id); if (x) toast(`Hold suggestion for ${driver(x.driverId).name} dismissed.`); render(); }
function holdSuggestionsHtml() {
  if (!S.holdSuggestions.length) return '';
  return `<div class="panel"><h3>Suggested holds <span class="muted small">${S.holdSuggestions.length}</span></h3><p class="small muted" style="margin:0 0 8px">Raised automatically after a no-show or late bail. Confirm to skip the driver in every offer until someone removes the hold, or dismiss.</p>
  ${S.holdSuggestions.map(x => { const d = driver(x.driverId); return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="avatar">${initials(d.name)}</span><div style="flex:1;min-width:180px"><b>${d.name}</b> ${lblHtml(d)}<div class="small" style="color:var(--warn)">${esc(x.reason)}</div><div class="small muted">${fmtDT(x.at)}</div></div><button class="btn sm primary" onclick="putOnHold('${d.id}',S.holdSuggestions.find(h=>h.id==='${x.id}').reason,'${x.id}')">Confirm hold</button><button class="btn sm" onclick="dismissSuggestion('${x.id}')">Dismiss</button></div>`; }).join('')}</div>`;
}
function holdsPanelHtml() {
  const opts = S.drivers.filter(d => d.active && !onHold(d)).map(d => `<option value="${d.id}">${d.name}</option>`).join('');
  return `<div class="panel"><h3>Performance holds <span class="muted small">${S.holds.length} on hold</span></h3><p class="small muted" style="margin:0 0 10px">A driver on hold is skipped in every offer, lane suggestion and rescue until the hold is removed. Holds live in this app; Airtable status is not changed.</p>
  ${S.holds.length ? `<div class="tbl" style="margin-bottom:10px"><table><thead><tr><th>Driver</th><th>Reason</th><th>Set by</th><th>Since</th><th></th></tr></thead><tbody>${S.holds.map(h => { const d = driver(h.driverId); return `<tr><td>${d.name}</td><td class="small">${esc(h.reason)}</td><td class="small">${h.by}</td><td class="small mono">${fmtDT(h.at)}</td><td><button class="btn sm" onclick="removeHold('${d.id}')">Remove hold</button></td></tr>`; }).join('')}</tbody></table></div>` : ''}
  <div class="row"><select id="holdDriver" aria-label="Driver">${opts}</select><input id="holdReason" placeholder="Reason, e.g. 2 late arrivals this week" style="flex:1;min-width:220px"><button class="btn" onclick="putOnHold($('#holdDriver').value,$('#holdReason').value)">Put on hold</button></div></div>`;
}

/* ---------------- Site check-in ---------------- */
function checkinRoutes() { return S.routes.filter(r => dayOffset(r) === 0 && r.status !== 'Cancelled' && !r.history && (r.driverId || r.checkin || r.noShow)).sort((a, b) => routeStart(a) - routeStart(b)); }
function ciTag(r) {
  if (!r.driverId) return '';
  const c = r.checkin; if (!c) return dayOffset(r) === 0 && ['Accepted', 'Needs attention'].includes(r.status) ? `<span class="ci Waiting">Not checked in</span>` : '';
  return `<span class="ci ${c.status === 'No-show' ? 'Noshow' : c.status}">${c.status} ${fmtTime(c.at)}</span>`;
}
function checkIn(rid, status) {
  const r = route(rid), d = driver(r.driverId), o = offer(r.offerId); if (!d) return;
  if (status === 'No-show') { noShow(r); return; }
  r.checkin = { status, at: now.getTime(), by: actorName() };
  ev(o.id, status === 'Arrived' ? 'Checked in: arrived' : 'Checked in: running late', actorName(), 'Site check-in');
  toast(`${r.name}: ${d.name} marked ${status === 'Arrived' ? 'arrived' : 'late'}. Dispatch sees it now.`); render();
}
function rescueCandidate(r) {
  const s = r.laneId ? laneSuggestion(r) : null; if (s && s.pick) return { d: s.pick.d, why: s.pick.why };
  const c = S.drivers.filter(d => !eligibility(d, r).length && !(S.settings.laneSkipWatch && stats(d).label === 'Watch')).sort((a, b) => stats(b).score - stats(a).score)[0];
  return c ? { d: c, why: `highest score free in ${area(r.area).name} today` } : null;
}
function noShow(r) {
  const d = driver(r.driverId), o = offer(r.offerId);
  o.outcome = 'No-show'; o.outcomeBy = actorName(); o.live = true; o.pending = null;
  ev(o.id, 'Marked no-show', actorName(), 'Site check-in'); ev(o.id, 'Outcome set', 'System', 'No-show');
  r.noShow = { driverId: d.id, at: now.getTime(), by: actorName() };
  r.status = 'Unassigned'; r.driverId = null; r.offerId = null; r.onfleet = false; r.attention = null; r.checkin = null; r.rescue = true;
  sendSms(d, fill(S.settings.templates.noshow, r, d), r, o);
  suggestHold(d, `No-show on ${r.name}, ${fmtDate(routeDate(r))}${stats(d).noshow > 1 ? ` (${stats(d).noshow} in 90 days)` : ''}`, r);
  let msg = `${d.name} marked no-show on ${r.name}. Route flagged Rescue.`;
  if (S.settings.noShowRescue === 'auto') {
    const c = rescueCandidate(r);
    if (c) { offerRoute(r, c.d, 'sms', { auto: true, silent: true, actor: 'System (no-show rescue)', detail: `Same-day rescue after no-show: ${c.why}` }); S.phoneDriver = c.d.id; msg += ` Rescue offer texted to ${c.d.name}.`; }
    else msg += ' No free driver to offer, so it is pinned under Rescue for you.';
  }
  toast(msg); render();
}

/* ---------------- Staffing health ---------------- */
function staffing(dayOff, areaIds) {
  return areaIds.map(aid => {
    const rs = S.routes.filter(r => r.area === aid && !r.history && r.status !== 'Cancelled' && dayOffset(r) === dayOff);
    const pool = S.drivers.filter(d => d.area === aid && d.active && !d.optOut && !onHold(d));
    const booked = new Set(rs.filter(r => r.driverId && ['Offered', 'Accepted', 'Needs attention', 'Completed'].includes(r.status) && pool.some(d => d.id === r.driverId)).map(r => r.driverId));
    const target = Math.ceil(rs.length * (1 + S.settings.benchPct / 100));
    const open = rs.filter(r => ['Unassigned', 'Offered', 'Needs attention'].includes(r.status)).length;
    const bench = pool.filter(d => !booked.has(d.id)).length;
    const date = rs[0] ? rs[0].date : null;
    const req = date && S.recruitRequests.find(x => x.area === aid && x.date === date);
    return { a: area(aid), routes: rs.length, target, active: pool.length, booked: booked.size, bench, open, short: Math.max(0, target - pool.length), date, req };
  });
}
function requestRecruiting(aid, date, n) { S.recruitRequests.push({ area: aid, date, n, by: actorName(), at: now.getTime() }); toast(`Recruiting request sent to Gigee ops: ${n} driver${n > 1 ? 's' : ''} for ${area(aid).name}.`); render(); }
function healthHtml() {
  if (S.boardTab === 4) return '';
  const ids = S.areaFilter === 'all' ? S.areas.map(a => a.id) : [S.areaFilter];
  const rows = staffing(S.boardTab, ids).filter(x => x.routes);
  if (!rows.length) return '';
  return `<div class="panel health" style="margin-bottom:14px"><h3>Staffing health <span class="muted small">routes vs active drivers + ${S.settings.benchPct}% bench</span></h3><div class="tbl"><table><thead><tr><th>Area</th><th class="r">Routes</th><th class="r">Target (+${S.settings.benchPct}%)</th><th class="r">Active drivers</th><th class="r">Booked</th><th class="r">Bench free</th><th class="r">Open routes</th><th>Coverage</th></tr></thead><tbody>
  ${rows.map(x => `<tr><td>${x.a.name}</td><td class="r num">${x.routes}</td><td class="r num">${x.target}</td><td class="r num">${x.active}</td><td class="r num">${x.booked}</td><td class="r num">${x.bench}</td><td class="r num">${x.open}</td><td class="st">${x.short ? `<span class="pill attention">Short ${x.short}</span> ${x.req ? `<span class="small muted">Recruiting asked ${fmtTime(x.req.at)}</span>` : `<button class="btn sm" onclick="requestRecruiting('${x.a.id}','${x.date}',${x.short})">Ask Gigee to recruit</button>`}` : '<span class="pill accepted">Healthy</span>'}</td></tr>`).join('')}
  </tbody></table></div><p class="small muted" style="margin:6px 0 0">Active means active in Airtable, not opted out and not on hold. Gigee recruits only when an area drops below target.</p></div>`;
}

function actorName() { return { dispatcher: 'Dana Ruiz', admin: 'Mike Patel', ops: 'Ruston' }[S.role]; }

function inbound(d, text) {
  const t = text.trim(); const up = t.toUpperCase();
  const m = mkMsg({ dir: 'in', driverId: d.id, body: t });
  if (up === 'STOP') { d.optOut = true; m.kind = 'optout'; toast(`${d.name} opted out. Blocked from offers until START.`); render(); return; }
  if (up === 'START') { d.optOut = false; m.kind = 'optin'; sendSms(d, 'You are opted back in to Gigee route texts.', null, null); toast(`${d.name} opted back in.`); render(); return; }
  if (up === 'HELP') { sendSms(d, fill(S.settings.templates.help, S.routes[0], d), null, null); render(); return; }
  const yes = ['YES', 'Y', 'ACCEPT'].includes(up), no = ['NO', 'N', 'DECLINE'].includes(up);
  const open = S.offers.find(o => o.driverId === d.id && o.open);
  const pend = S.offers.find(o => o.driverId === d.id && o.pending && route(o.routeId).driverId === d.id);
  if (open) { m.offerId = open.id; m.routeId = open.routeId; if (yes) acceptOffer(open); else if (no) declineOffer(open); else { m.kind = 'other'; sendSms(d, fill(S.settings.templates.help, route(open.routeId), d), route(open.routeId), open); toast('Unrecognized reply logged to inbox.'); } render(); return; }
  if (pend) {
    const r = route(pend.routeId); m.offerId = pend.id; m.routeId = r.id;
    if (yes) { if (pend.pending === 'reconfirm') pend.reconfirmedAt = now.getTime(); else if (pend.pending === 'final') pend.finalConfirmedAt = now.getTime(); ev(pend.id, pend.pending === 'change' ? 'Kept after change' : (pend.pending === 'reconfirm' ? 'Reconfirmed' : 'Final confirmed'), 'Driver', 'SMS'); pend.pending = null; if (r.status === 'Needs attention') { r.status = 'Accepted'; r.attention = null; } toast(`${d.name} confirmed ${r.name}.`); }
    else if (no) { pend.pending = null; release(r, 'Driver'); return; }
    else { m.kind = 'other'; sendSms(d, fill(S.settings.templates.help, r, d), r, pend); toast('Unrecognized reply logged to inbox.'); }
    render(); return;
  }
  // YES/NO with nothing open
  if (yes || no) { const lastO = S.offers.filter(o => o.driverId === d.id && o.sentAt).sort((a, b) => b.sentAt - a.sentAt)[0]; if (lastO) { m.offerId = lastO.id; m.routeId = lastO.routeId; } m.kind = 'late'; sendSms(d, fill(S.settings.templates.expired, lastO ? route(lastO.routeId) : S.routes[0], d), null, null); toast(`${d.name} replied with no open offer. Told the route is closed.`); render(); return; }
  m.kind = 'other'; sendSms(d, fill(S.settings.templates.help, S.routes[0], d), null, null); toast('Unrecognized text logged to inbox.'); render();
}

/* ---------------- Lanes: route recognition and history ---------------- */
function lane(id) { return S.lanes.find(l => l.id === id); }
function addrKey(a) { return a.toLowerCase().replace(/[^a-z0-9]/g, ''); }
function laneRuns(l, excludeId) { return S.routes.filter(r => r.laneId === l.id && r.id !== excludeId && r.status !== 'Cancelled').sort((a, b) => routeStart(b) - routeStart(a)); }
function pastRuns(l, excludeId) { return laneRuns(l, excludeId).filter(r => routeStart(r) < now.getTime()).slice(0, S.settings.laneWindow); }
function ranOK(r) { return r.outcome === 'Completed' || (!r.outcome && routeStart(r) < now.getTime() && r.status === 'Accepted'); }
function lanePoolKeys(l, excludeId) { const set = new Set(); pastRuns(l, excludeId).forEach(r => r.orders.forEach(o => set.add(addrKey(o.addr)))); return set; }
function routeKeys(r) { return [...new Set(r.orders.filter(o => o.status === 'active').map(o => addrKey(o.addr)))]; }
function matchLane(r) {
  const keys = routeKeys(r); let best = null;
  for (const l of S.lanes) {
    if (l.area !== r.area) continue; const pool = lanePoolKeys(l, r.id); if (!pool.size) continue;
    const seen = keys.filter(k => pool.has(k)).length, pct = keys.length ? seen / keys.length : 0;
    if (!best || pct > best.pct) best = { laneId: l.id, pct, seen, total: keys.length };
  }
  return best;
}
function relink(r) { r.laneMatch = matchLane(r); if (!r.laneManual) r.laneId = r.laneMatch && r.laneMatch.pct * 100 >= S.settings.laneThreshold ? r.laneMatch.laneId : null; }
function relinkAll() { S.routes.filter(r => !r.history).forEach(relink); }
function laneMatchPct(r) { return r.laneMatch && r.laneMatch.laneId === r.laneId ? Math.round(r.laneMatch.pct * 100) : null; }
function laneDriverCounts(l, excludeId) { const c = {}; pastRuns(l, excludeId).filter(r => r.driverId && ranOK(r)).forEach(r => c[r.driverId] = (c[r.driverId] || 0) + 1); return c; }
function laneRegular(l, excludeId) { const c = laneDriverCounts(l, excludeId); const top = Object.entries(c).sort((a, b) => b[1] - a[1])[0]; return top ? { d: driver(top[0]), n: top[1], of: pastRuns(l, excludeId).filter(ranOK).length } : null; }
function laneSuggestion(r) {

  const runs = pastRuns(l, r.id).filter(x => x.driverId && ranOK(x));

  if (l.preferredDriverId) { seen.add(l.preferredDriverId); cands.push({ d: driver(l.preferredDriverId), why: 'preferred driver for this lane', n: counts[l.preferredDriverId] || 0 }); }
  for (const x of runs) { if (seen.has(x.driverId)) continue; seen.add(x.driverId); cands.push({ d: driver(x.driverId), why: `last ran it ${fmtDate(routeDate(x))}${x.outcome ? '' : ' (awaiting closeout)'}`, n: counts[x.driverId] || 0 }); }
  cands.forEach(c => { c.blocked = eligibility(c.d, r); if (S.settings.laneSkipWatch && c.d.active && stats(c.d).label === 'Watch') c.blocked.push('Watch status'); });
  const pick = cands.find(c => !c.blocked.length) || null;
  return { lane: l, runs, cands, pick, regular: laneRegular(l, r.id) };
}
function shortName(d) { const p = d.name.split(' '); return `${p[0]} ${p[1][0]}.`; }
function autoOffer(rs) {
  const out = { sent: [], skipped: [] };
  for (const r of rs.filter(x => x.status === 'Unassigned' && x.laneId).sort((a, b) => routeStart(a) - routeStart(b))) {
    const s = laneSuggestion(r);
    if (!s.pick) { out.skipped.push(`${r.name} (${s.cands.length ? s.cands.map(c => `${c.d.name.split(' ')[0]}: ${c.blocked[0].toLowerCase()}`).join(', ') : 'no past driver'})`); continue; }
    offerRoute(r, s.pick.d, 'sms', { auto: true, silent: true }); out.sent.push(`${r.name} to ${s.pick.d.name}`);
  }
  return out;
}
function runAutoOffer(ids) { const o = autoOffer(ids.map(route)); render(); toast(o.sent.length ? `Auto-offered ${o.sent.length}: ${o.sent.join('; ')}.` : 'Nothing to auto-offer.'); if (o.skipped.length) setTimeout(() => toast(`Skipped ${o.skipped.join('; ')}.`), 400); }
relinkAll();

/* ---------------- Closeout ---------------- */
function closeoutRoutes() { return S.routes.filter(r => dayOffset(r) < 0 && r.driverId && ['Accepted', 'Needs attention', 'Completed'].includes(r.status) && !r.paid); }
function setOutcome(r, outcome) {
  const o = offer(r.offerId); o.outcome = outcome; o.outcomeBy = actorName(); ev(o.id, 'Outcome set', actorName(), outcome); r.outcome = outcome; r.status = 'Completed';

function exportPay(rs) { const x = { id: 'EXP-' + (S.exports.length + 31), range: `${fmtDate(routeDate(rs[0]))} to ${fmtDate(routeDate(rs[rs.length - 1]))}`, by: actorName(), at: now.getTime(), status: 'exported', routeIds: rs.map(r => r.id) }; S.exports.push(x); rs.forEach(r => r.exportId = x.id); return x; }

function applyImport(p) {
  const batch = { id: 'IMP-' + (119 + S.imports.length - 2), file: p.file, by: actorName(), time: now.getTime(), counts: { new: p.new.length, changed: p.changed.length, unchanged: p.unchanged, missing: p.missing.length, rejected: p.rejected.length } };
  S.imports.unshift(batch);
  if (p.repeat) { toast('Same file as last import. Nothing changed.'); return; }
  const nr = addRoute('RR-0420', 17, 'A1', 0); nr.orders = p.new.map(x => x.order); nr.vehicle = 'SUV'; relink(nr);
  for (const c of p.changed) {
    const r = route(c.routeName);
    if (c.order) { const o = c.order; o.history.push({ field: c.field, old: c.old, new: c.new, batch: batch.id, time: now.getTime() }); if (c.field === 'Delivery address') o.addr = c.new; else if (c.field === 'Package count') o.pkgs = Number(c.new); }
    if (c.added) { c.added.forEach(o => { o.history.push({ field: 'Route', old: '', new: r.name, batch: batch.id, time: now.getTime() }); r.orders.push(o); }); r.vehicle = activeStops(r) > 13 ? 'Van' : r.vehicle; }
    if (['Offered', 'Accepted'].includes(r.status) && r.status !== 'Needs attention') { r.status = 'Needs attention'; r.attention = 'Order changed after acceptance'; if (r.offerId) ev(r.offerId, 'Order changed after acceptance', 'Import ' + batch.id, c.field); }
  }
  for (const mrow of p.missing) { mrow.order.inLatest = false; const r = route(mrow.routeName); if (mrow.decision === 'cancel') { mrow.order.status = 'cancelled'; mrow.order.history.push({ field: 'Status', old: 'active', new: 'cancelled', batch: batch.id, time: now.getTime() }); } else { r.attention = r.attention || 'Order not in latest file'; } }
  S.uploadsDone.weekend = true;
  p.changed.forEach(c => relink(route(c.routeName)));
  toast(`Imported ${batch.id}: ${batch.counts.new} new, ${batch.counts.changed} changed, ${batch.counts.missing} missing, ${batch.counts.rejected} rejected.`);
  if (S.settings.laneAuto === 'auto') { const o = autoOffer([nr]); setTimeout(() => toast(o.sent.length ? `Lane rule: offer texted for ${o.sent.join('; ')}.` : o.skipped.length ? `Lane rule skipped ${o.skipped.join('; ')}.` : `Lane rule: ${nr.name} did not match a lane, left Unassigned.`), 400); }
}
